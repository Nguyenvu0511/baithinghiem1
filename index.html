<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAP 183 - Duolingo Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Nunito', sans-serif; 
            background: #fff; 
            margin:0; 
            display:flex; 
            flex-direction:column; 
            height: 100vh; 
            overflow: hidden;
            color: #3c3c3c;
        }
        
        header { 
            display: flex; 
            align-items: center; 
            padding: 20px 40px; 
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .close-btn {
            font-size: 24px;
            color: #afafaf;
            cursor: pointer;
            font-weight: 800;
        }
        .progress-bar-bg { 
            flex-grow: 1; 
            background: #e5e5e5; 
            height: 18px; 
            border-radius: 9px; 
            margin: 0 20px; 
            position: relative; 
            overflow: hidden;
        }
        .progress-bar-fill { 
            background: #58cc02; 
            height: 100%; 
            border-radius: 9px; 
            width: 0%; 
            transition: width 0.4s ease; 
        }
        .progress-highlight {
            position: absolute;
            top: 4px;
            left: 10px;
            right: 10px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        main { 
            flex-grow: 1; 
            padding: 0 20px; 
            max-width: 600px; 
            margin: 0 auto; 
            width: 100%; 
            display:flex; 
            flex-direction:column; 
            justify-content:center;
            box-sizing: border-box;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .question-title { 
            font-size: 28px; 
            font-weight: 800; 
            margin-bottom: 10px; 
        }
        .question-subtitle {
            font-size: 18px;
            color: #777;
            margin-bottom: 30px;
        }
        
        .question-content { 
            font-size: 32px; 
            margin-bottom: 40px; 
            text-align: center; 
            color: #1cb0f6;
        }
        
        .options { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 15px; 
        }
        .option { 
            border: 2px solid #e5e5e5; 
            border-radius: 15px; 
            padding: 18px 20px; 
            font-size: 20px; 
            cursor: pointer; 
            transition: all 0.1s; 
            color: #4b4b4b; 
            font-weight: 700; 
            background: white;
            box-shadow: 0 2px 0 #e5e5e5;
        }
        .option:hover { 
            background: #f7f7f7; 
        }
        .option:active {
            transform: translateY(2px);
            box-shadow: none;
        }
        .option.selected { 
            border-color: #84d8ff; 
            background: #ddf4ff; 
            color: #1cb0f6; 
            box-shadow: 0 2px 0 #84d8ff;
        }
        .option.disabled {
            pointer-events: none;
        }
        
        .bottom-bar { 
            padding: 30px 20px; 
            border-top: 2px solid #e5e5e5; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: background 0.3s;
        }
        .bottom-bar.correct { 
            background: #d7ffb8; 
            border-color: #d7ffb8; 
        }
        .bottom-bar.incorrect { 
            background: #ffdfe0; 
            border-color: #ffdfe0; 
        }
        
        .feedback { 
            display:none; 
            flex-grow: 1; 
        }
        .feedback h2 { 
            margin: 0; 
            font-size: 24px; 
            font-weight: 800;
        }
        .bottom-bar.correct .feedback h2 { color: #58a700; }
        .bottom-bar.incorrect .feedback h2 { color: #ea2b2b; }
        
        .btn-check { 
            background: #e5e5e5; 
            color: #afafaf; 
            border: none; 
            padding: 15px 40px; 
            font-size: 18px; 
            font-weight: 800; 
            border-radius: 15px; 
            cursor: default; 
            margin-left: auto; 
            text-transform: uppercase;
            font-family: 'Nunito', sans-serif;
        }
        .btn-check.active { 
            background: #58cc02; 
            color: #fff; 
            cursor: pointer; 
            box-shadow: 0 4px 0 #58a700; 
        }
        .btn-check.active:active { 
            transform: translateY(4px); 
            box-shadow: none; 
        }
        
        .bottom-bar.correct .btn-check { 
            background: #58cc02; 
            box-shadow: 0 4px 0 #58a700; 
            color: white;
            cursor: pointer;
        }
        .bottom-bar.incorrect .btn-check { 
            background: #ff4b4b; 
            box-shadow: 0 4px 0 #ea2b2b; 
            color: white;
            cursor: pointer;
        }

        .explanation { 
            font-size: 16px; 
            margin-top: 10px; 
            font-weight: 700;
            display: none;
        }
        .bottom-bar.incorrect .explanation, .bottom-bar.correct .explanation { 
            display: block; 
        }
        .bottom-bar.correct .explanation { color: #58a700; }
        .bottom-bar.incorrect .explanation { color: #ea2b2b; }

        #end-screen { 
            display: none; 
            text-align: center; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            height: 100%;
        }
        #end-screen h1 { 
            color: #f49000; 
            font-size: 36px; 
            margin-bottom: 20px;
        }
        #end-screen p {
            font-size: 20px;
            color: #777;
        }
        
        /* Audio elements */
        audio { display: none; }

        .question-content {
            transition: opacity 0.1s;
        }
        .question-content:active {
            opacity: 0.5;
        }

        /* --- MOBILE OPTIMIZATIONS --- */
        @media (max-width: 600px) {
            header { padding: 15px 20px; }
            .question-title { font-size: 22px; margin-bottom: 5px; }
            .question-subtitle { font-size: 16px; margin-bottom: 20px; }
            .question-content { font-size: 24px; margin-bottom: 25px; }
            .option { padding: 12px 15px; font-size: 16px; border-radius: 12px; }
            
            .bottom-bar { 
                padding: 15px; 
                flex-direction: column; 
                gap: 15px; 
                align-items: stretch;
            }
            .feedback h2 { font-size: 20px; text-align: center; }
            .explanation { font-size: 14px; text-align: center; }
            .btn-check { 
                width: 100%; 
                margin: 0; 
                padding: 15px; 
            }
        }
    </style>
</head>
<body>

<div id="start-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <h1 style="color:#1cb0f6;">Sẵn sàng học chưa?</h1>
    <button class="btn-check active" style="margin-top:20px; padding:15px 40px; cursor:pointer;" onclick="startApp()">BẮT ĐẦU</button>
</div>

<header id="header">
    <div class="close-btn" onclick="goBack()" style="font-size:28px;">&lt;</div>
    <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"><div class="progress-highlight"></div></div>
    </div>
    <div class="close-btn" onclick="restartApp()" style="font-size:28px;">⟲</div>
</header>

<main id="quiz-screen">
    <div class="question-title" id="q-title">Chọn nghĩa đúng</div>
    <div class="question-subtitle" id="q-subtitle">Từ vựng</div>
    <div class="question-content" id="q-content" onclick="replayQuestionAudio()">からい</div>
    
    <div id="q-hint" style="color: #bbb; font-size: 18px; margin-top: -15px; margin-bottom: 20px; text-align: center; font-style: italic; display: none;"></div>

    <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;">
        <button id="btn-toggle-hint" class="btn-check active" style="padding: 10px 15px; font-size: 14px;" onclick="toggleHint()">Dịch tiếng Việt</button>
        <button id="btn-toggle-options" class="btn-check active" style="padding: 10px 15px; font-size: 14px;" onclick="toggleAnswers()">Hiện đáp án</button>
    </div>

    <div class="options" id="options-container" style="display: none;">
        <!-- Options injected here via JS -->
    </div>
</main>

<main id="end-screen">
    <h1>Hoàn thành bài học! 🎉</h1>
    <p>Cậu đã nắm vững các câu hỏi trong đề thi ngày mai.</p>
    <button class="btn-check active" style="margin: 30px auto; display: block;" onclick="restartApp()">Học lại từ đầu</button>
</main>

<div class="bottom-bar" id="bottom-bar">
    <div class="feedback" id="feedback-container">
        <h2 id="feedback-title">Chính xác!</h2>
        <div class="explanation" id="feedback-explanation">Mẹo: Nhớ kỹ nhé!</div>
    </div>
    <button class="btn-check" id="btn-check" onclick="onCheckClick()">Kiểm tra</button>
</div>

    function speakJP(text) {
        if (ttsMap[text]) {
            const a = new Audio(ttsMap[text]);
            a.play().catch(e=>console.log(e));
        }
    }


    function replayQuestionAudio() {
        speakJP(questions[currentQuestionIndex].content);
    }

    function toggleHint() {
        const hint = document.getElementById('q-hint');
        const btn = document.getElementById('btn-toggle-hint');
        if (hint.style.display === 'none') {
            hint.style.display = 'block';
            btn.innerText = 'Ẩn tiếng Việt';
        } else {
            hint.style.display = 'none';
            btn.innerText = 'Dịch tiếng Việt';
        }
    }

    function toggleAnswers() {
        const container = document.getElementById('options-container');
        const btn = document.getElementById('btn-toggle-options');
        if (container.style.display === 'none') {
            container.style.display = 'grid';
            btn.innerText = 'Ẩn đáp án';
        } else {
            container.style.display = 'none';
            btn.innerText = 'Hiện đáp án';
        }
    }

    function loadQuestion() {
        if (currentQuestionIndex >= questions.length) {
            ui.quizScreen.style.display = 'none';
            ui.header.style.display = 'none';
            ui.bottomBar.style.display = 'none';
            ui.endScreen.style.display = 'flex';
            return;
        }

        const q = questions[currentQuestionIndex];
        ui.title.innerText = q.title;
        ui.subtitle.innerText = q.subtitle;
        ui.content.innerText = q.content;
        
        document.getElementById('q-hint').innerText = q.vi_hint || '';
        document.getElementById('q-hint').style.display = 'none';
        
        const btnHint = document.getElementById('btn-toggle-hint');
        btnHint.innerText = 'Dịch tiếng Việt';
        if (q.vi_hint) {
            btnHint.style.display = 'block';
        } else {
            btnHint.style.display = 'none';
        }
        
        if (ttsMap[q.content]) {
            ui.content.style.cursor = 'pointer';
        } else {
            ui.content.style.cursor = 'default';
        }
        
        // Auto-play question if it's Japanese
        setTimeout(() => speakJP(q.content), 300);

        ui.optionsContainer.innerHTML = '';
        ui.optionsContainer.style.display = 'none';
        document.getElementById('btn-toggle-options').style.display = 'block';
        document.getElementById('btn-toggle-options').innerText = 'Hiện đáp án';
        selectedOption = null;
        isChecked = false;
        
        q.options.forEach((opt, index) => {
            const div = document.createElement('div');
            div.className = 'option';
            div.innerText = opt;
            div.onclick = () => {
                selectOption(div, index);
                speakJP(opt);
            };
            ui.optionsContainer.appendChild(div);
        });

        // Reset bottom bar
        ui.bottomBar.className = 'bottom-bar';
        ui.feedbackContainer.style.display = 'none';
        ui.btnCheck.className = 'btn-check';
        ui.btnCheck.innerText = 'Kiểm tra';
        
        // Update progress bar
        const progress = (currentQuestionIndex / questions.length) * 100;
        ui.progressBar.style.width = progress + '%';
    }

    function selectOption(el, index) {
        if (isChecked) return;
        
        document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
        el.classList.add('selected');
        selectedOption = index;
        
        ui.btnCheck.classList.add('active');
    }

    const audioCorrect = new Audio('duolingo-correct.mp3');
    const audioWrong = new Audio('duolingo-wrong.mp3');

    function playCorrectSound() {
        audioCorrect.currentTime = 0;
        audioCorrect.play().catch(e => console.log(e));
    }

    function playIncorrectSound() {
        audioWrong.currentTime = 0;
        audioWrong.play().catch(e => console.log(e));
    }

    function onCheckClick() {
        if (selectedOption === null) return;

        if (!isChecked) {
            // Check answer
            isChecked = true;
            const q = questions[currentQuestionIndex];
            const isCorrect = selectedOption === q.correct;
            
            ui.btnCheck.innerText = 'Tiếp tục';
            ui.feedbackContainer.style.display = 'block';
            ui.feedbackExplanation.innerText = q.explanation || "";

            // Disable all options
            document.querySelectorAll('.option').forEach(opt => opt.classList.add('disabled'));
            // Hide toggle buttons
            document.getElementById('btn-toggle-options').style.display = 'none';
            document.getElementById('btn-toggle-hint').style.display = 'none';

            if (isCorrect) {
                ui.bottomBar.className = 'bottom-bar correct';
                ui.feedbackTitle.innerText = 'Chính xác! Làm tốt lắm!';
                playCorrectSound();
            } else {
                ui.bottomBar.className = 'bottom-bar incorrect';
                ui.feedbackTitle.innerText = 'Chưa đúng rồi!';
                playIncorrectSound();
                // Also highlight correct answer
                document.querySelectorAll('.option')[q.correct].style.borderColor = '#58cc02';
                document.querySelectorAll('.option')[q.correct].style.color = '#58cc02';
            }
        } else {
            // Save history BEFORE moving to next question
            historyState.push({
                index: currentQuestionIndex,
                qs: JSON.parse(JSON.stringify(questions))
            });

            // Move to next question
            const q = questions[currentQuestionIndex];
            if (selectedOption === q.correct) {
                currentQuestionIndex++;
            } else {
                // Duolingo logic: push failed question to the end of the array
                questions.push(questions.splice(currentQuestionIndex, 1)[0]);
                // do not increase currentQuestionIndex
            }
            saveState(); // Save progress
            loadQuestion();
        }
    }

    let historyState = [];

    function saveState() {
        localStorage.setItem('jap183_saved', JSON.stringify({
            index: currentQuestionIndex,
            qs: questions,
            hist: historyState
        }));
    }

    function loadState() {
        const saved = localStorage.getItem('jap183_saved');
        if (saved) {
            try {
                const state = JSON.parse(saved);
                if (state.qs && state.qs.length === questions.length) {
                    currentQuestionIndex = state.index;
                    questions = state.qs;
                    historyState = state.hist || [];
                }
            } catch(e) {}
        }
    }

    function startApp() {
        document.documentElement.requestFullscreen().catch(e=>console.log(e));
        document.getElementById('start-overlay').style.display = 'none';
        loadState();
        loadQuestion();
    }

    function restartApp() {
        if(confirm("Bạn có chắc chắn muốn làm lại từ đầu không? Toàn bộ tiến trình sẽ bị xóa.")) {
            localStorage.removeItem('jap183_saved');
            location.reload();
        }
    }

    function goBack() {
        if (historyState.length > 0) {
            const prevState = historyState.pop();
            currentQuestionIndex = prevState.index;
            questions = prevState.qs;
            saveState();
            loadQuestion();
        } else {
            alert("Đây là câu hỏi đầu tiên, không thể quay lại được nữa!");
        }
    }
</script>
