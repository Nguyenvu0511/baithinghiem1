<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAP 183 - Duolingo Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Nunito', sans-serif; 
            background: #fff; 
            margin:0; 
            display:flex; 
            flex-direction:column; 
            height: 100vh; 
            overflow: hidden;
            color: #3c3c3c;
        }
        
        header { 
            display: flex; 
            align-items: center; 
            padding: 20px 40px; 
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .close-btn {
            font-size: 24px;
            color: #afafaf;
            cursor: pointer;
            font-weight: 800;
        }
        .progress-bar-bg { 
            flex-grow: 1; 
            background: #e5e5e5; 
            height: 18px; 
            border-radius: 9px; 
            margin: 0 20px; 
            position: relative; 
            overflow: hidden;
        }
        .progress-bar-fill { 
            background: #58cc02; 
            height: 100%; 
            border-radius: 9px; 
            width: 0%; 
            transition: width 0.4s ease; 
        }
        .progress-highlight {
            position: absolute;
            top: 4px;
            left: 10px;
            right: 10px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        main { 
            flex-grow: 1; 
            padding: 0 20px; 
            max-width: 600px; 
            margin: 0 auto; 
            width: 100%; 
            display:flex; 
            flex-direction:column; 
            justify-content:center;
            box-sizing: border-box;
        }
        
        .question-title { 
            font-size: 28px; 
            font-weight: 800; 
            margin-bottom: 10px; 
        }
        .question-subtitle {
            font-size: 18px;
            color: #777;
            margin-bottom: 30px;
        }
        
        .question-content { 
            font-size: 32px; 
            margin-bottom: 40px; 
            text-align: center; 
            color: #1cb0f6;
        }
        
        .options { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 15px; 
        }
        .option { 
            border: 2px solid #e5e5e5; 
            border-radius: 15px; 
            padding: 18px 20px; 
            font-size: 20px; 
            cursor: pointer; 
            transition: all 0.1s; 
            color: #4b4b4b; 
            font-weight: 700; 
            background: white;
            box-shadow: 0 2px 0 #e5e5e5;
        }
        .option:hover { 
            background: #f7f7f7; 
        }
        .option:active {
            transform: translateY(2px);
            box-shadow: none;
        }
        .option.selected { 
            border-color: #84d8ff; 
            background: #ddf4ff; 
            color: #1cb0f6; 
            box-shadow: 0 2px 0 #84d8ff;
        }
        .option.disabled {
            pointer-events: none;
        }
        
        .bottom-bar { 
            padding: 30px 20px; 
            border-top: 2px solid #e5e5e5; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: background 0.3s;
        }
        .bottom-bar.correct { 
            background: #d7ffb8; 
            border-color: #d7ffb8; 
        }
        .bottom-bar.incorrect { 
            background: #ffdfe0; 
            border-color: #ffdfe0; 
        }
        
        .feedback { 
            display:none; 
            flex-grow: 1; 
        }
        .feedback h2 { 
            margin: 0; 
            font-size: 24px; 
            font-weight: 800;
        }
        .bottom-bar.correct .feedback h2 { color: #58a700; }
        .bottom-bar.incorrect .feedback h2 { color: #ea2b2b; }
        
        .btn-check { 
            background: #e5e5e5; 
            color: #afafaf; 
            border: none; 
            padding: 15px 40px; 
            font-size: 18px; 
            font-weight: 800; 
            border-radius: 15px; 
            cursor: default; 
            margin-left: auto; 
            text-transform: uppercase;
            font-family: 'Nunito', sans-serif;
        }
        .btn-check.active { 
            background: #58cc02; 
            color: #fff; 
            cursor: pointer; 
            box-shadow: 0 4px 0 #58a700; 
        }
        .btn-check.active:active { 
            transform: translateY(4px); 
            box-shadow: none; 
        }
        
        .bottom-bar.correct .btn-check { 
            background: #58cc02; 
            box-shadow: 0 4px 0 #58a700; 
            color: white;
            cursor: pointer;
        }
        .bottom-bar.incorrect .btn-check { 
            background: #ff4b4b; 
            box-shadow: 0 4px 0 #ea2b2b; 
            color: white;
            cursor: pointer;
        }

        .explanation { 
            font-size: 16px; 
            margin-top: 10px; 
            font-weight: 700;
            display: none;
        }
        .bottom-bar.incorrect .explanation, .bottom-bar.correct .explanation { 
            display: block; 
        }
        .bottom-bar.correct .explanation { color: #58a700; }
        .bottom-bar.incorrect .explanation { color: #ea2b2b; }

        #end-screen { 
            display: none; 
            text-align: center; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            height: 100%;
        }
        #end-screen h1 { 
            color: #f49000; 
            font-size: 36px; 
            margin-bottom: 20px;
        }
        #end-screen p {
            font-size: 20px;
            color: #777;
        }
        
        /* Audio elements */
        audio { display: none; }
    </style>
</head>
<body>

<header id="header">
    <div class="close-btn">✖</div>
    <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"><div class="progress-highlight"></div></div>
    </div>
</header>

<main id="quiz-screen">
    <div class="question-title" id="q-title">Chọn nghĩa đúng</div>
    <div class="question-subtitle" id="q-subtitle">Từ vựng</div>
    <div class="question-content" id="q-content">からい</div>
    
    <div class="options" id="options-container">
        <!-- Options injected here via JS -->
    </div>
</main>

<main id="end-screen">
    <h1>Hoàn thành bài học! 🎉</h1>
    <p>Cậu đã nắm vững các câu hỏi trong đề thi ngày mai.</p>
    <button class="btn-check active" style="margin: 30px auto; display: block;" onclick="location.reload()">Học lại từ đầu</button>
</main>

<div class="bottom-bar" id="bottom-bar">
    <div class="feedback" id="feedback-container">
        <h2 id="feedback-title">Chính xác!</h2>
        <div class="explanation" id="feedback-explanation">Mẹo: Nhớ kỹ nhé!</div>
    </div>
    <button class="btn-check" id="btn-check" onclick="onCheckClick()">Kiểm tra</button>
</div>

<script>
    const questions = [
        {
            type: "vocab",
            title: "Từ này có nghĩa là gì?",
            subtitle: "Nhìn kĩ tiếng Nhật nhé",
            content: "からい (karai)",
            options: ["Cay", "Ngọt", "Đắng", "Rau"],
            correct: 0,
            explanation: "からい (karai) nghĩa là CAY."
        },
        {
            type: "vocab",
            title: "Chọn từ tiếng Nhật đúng",
            subtitle: "Dịch sang tiếng Nhật",
            content: "Cơm hộp",
            options: ["サラダ (sarada)", "おべんとう (obentou)", "ビール (biiru)", "ワイン (wain)"],
            correct: 1,
            explanation: "Cơm hộp là おべんとう (obentou)."
        },
        {
            type: "grammar",
            title: "Điền vào chỗ trống",
            subtitle: "Học vẹt ngữ pháp",
            content: "ピクニックは 土曜日（___） 日曜日（___） どちらが いいですか。",
            options: ["に / に", "で / で", "と / と", "が / が"],
            correct: 2,
            explanation: "Hỏi so sánh 2 cái (どちらがいいですか) thì luôn dùng と / と."
        },
        {
            type: "vocab",
            title: "Từ này có nghĩa là gì?",
            subtitle: "Nhớ mặt chữ",
            content: "まずい (mazui)",
            options: ["Dở (vị)", "Ngon", "Đáng tiếc", "Chua"],
            correct: 0,
            explanation: "まずい (mazui) nghĩa là dở, không ngon."
        },
        {
            type: "grammar",
            title: "Chọn cụm từ đúng",
            subtitle: "Biến đổi từ: つめたい (lạnh)",
            content: "今日はとても暑いです。このジュースは（___）、おいしくないです。",
            options: ["つめたいです", "つめたくなくて", "つめたいから", "つめたいで"],
            correct: 1,
            explanation: "Chuyển thành KHÔNG LẠNH: つめたくなくて (hoặc つめたくないですから)."
        },
        {
            type: "vocab",
            title: "Dịch sang tiếng Việt",
            subtitle: "Nhớ mặt chữ Hán",
            content: "料理 (りょうり)",
            options: ["Đồ uống", "Màu sắc", "Món ăn", "Đồ ăn"],
            correct: 2,
            explanation: "料理 (ryouri) là Món ăn / Việc nấu ăn. (Khác với 食べ物 là Đồ ăn chung chung)."
        },
        {
            type: "grammar",
            title: "Điền vào chỗ trống",
            subtitle: "Nối câu với tính từ",
            content: "この こうえんは（ しずか → ___ ）、きもちが いいです。",
            options: ["しずかに", "しずかだ", "しずかくて", "しずかで"],
            correct: 3,
            explanation: "Tính từ 'shizuka' là tính từ đuôi NA. Nối câu phải dùng で (de)."
        },
        {
            type: "vocab",
            title: "Sắp xếp câu đúng",
            subtitle: "Đề bài: それは (ナイフ/ ですね/べんり/そうな)。",
            content: "Đâu là câu hoàn chỉnh đúng?",
            options: [
                "それは べんり ナイフ そうな ですね。",
                "それは ナイフ そうな べんり ですね。",
                "それは べんりそうな ナイフ ですね。"
            ],
            correct: 2,
            explanation: "Thứ tự: べんり (tiện) -> そうな (có vẻ) -> ナイフ (dao) -> ですね (nhỉ)."
        },
        {
            type: "vocab",
            title: "Chọn từ tiếng Nhật đúng",
            subtitle: "Nhớ cách viết",
            content: "Chua",
            options: ["あまい (amai)", "からい (karai)", "すっぱい (suppai)"],
            correct: 2,
            explanation: "Chua là すっぱい (suppai)."
        },
        {
            type: "grammar",
            title: "Điền vào chỗ trống",
            subtitle: "Từ để hỏi",
            content: "ピクニックの日はいつがいいですか。（ ___ ）いいです。",
            options: ["いつでも", "どこでも", "どっちでも"],
            correct: 0,
            explanation: "Người ta hỏi いつ (Khi nào) thì trả lời là いつでも (Khi nào cũng được)."
        }
    ];

    let currentQuestionIndex = 0;
    let selectedOption = null;
    let isChecked = false;
    
    const ui = {
        title: document.getElementById('q-title'),
        subtitle: document.getElementById('q-subtitle'),
        content: document.getElementById('q-content'),
        optionsContainer: document.getElementById('options-container'),
        btnCheck: document.getElementById('btn-check'),
        bottomBar: document.getElementById('bottom-bar'),
        feedbackContainer: document.getElementById('feedback-container'),
        feedbackTitle: document.getElementById('feedback-title'),
        feedbackExplanation: document.getElementById('feedback-explanation'),
        progressBar: document.getElementById('progress-bar'),
        quizScreen: document.getElementById('quiz-screen'),
        endScreen: document.getElementById('end-screen'),
        header: document.getElementById('header')
    };

    const ttsMap = {"からい (karai)": "tts_2.mp3", "からい (karai) nghĩa là CAY.": "tts_3.mp3", "サラダ (sarada)": "tts_4.mp3", "おべんとう (obentou)": "tts_5.mp3", "ビール (biiru)": "tts_6.mp3", "ワイン (wain)": "tts_7.mp3", "Cơm hộp là おべんとう (obentou).": "tts_8.mp3", "ピクニックは 土曜日（___） 日曜日（___） どちらが いいですか。": "tts_9.mp3", "に / に": "tts_10.mp3", "で / で": "tts_11.mp3", "と / と": "tts_12.mp3", "が / が": "tts_13.mp3", "まずい (mazui)": "tts_14.mp3", "まずい (mazui) nghĩa là dở, không ngon.": "tts_15.mp3", "Biến đổi từ: つめたい (lạnh)": "tts_16.mp3", "今日はとても暑いです。このジュースは（___）、おいしくないです。": "tts_17.mp3", "つめたいです": "tts_18.mp3", "つめたくなくて": "tts_19.mp3", "つめたいから": "tts_20.mp3", "つめたいで": "tts_21.mp3", "Chuyển thành KHÔNG LẠNH: つめたくなくて (hoặc つめたくないですから).": "tts_22.mp3", "料理 (りょうり)": "tts_23.mp3", "料理 (ryouri) là Món ăn / Việc nấu ăn. (Khác với 食べ物 là Đồ ăn chung chung).": "tts_24.mp3", "この こうえんは（ しずか → ___ ）、きもちが いいです。": "tts_25.mp3", "しずかに": "tts_26.mp3", "しずかだ": "tts_27.mp3", "しずかくて": "tts_28.mp3", "しずかで": "tts_29.mp3", "Tính từ 'shizuka' là tính từ đuôi NA. Nối câu phải dùng で (de).": "tts_30.mp3", "Đề bài: それは (ナイフ/ ですね/べんり/そうな)。": "tts_31.mp3", "それは べんり ナイフ そうな ですね。": "tts_32.mp3", "それは ナイフ そうな べんり ですね。": "tts_33.mp3", "それは べんりそうな ナイフ ですね。": "tts_34.mp3", "Thứ tự: べんり (tiện) -> そうな (có vẻ) -> ナイフ (dao) -> ですね (nhỉ).": "tts_35.mp3", "あまい (amai)": "tts_36.mp3", "すっぱい (suppai)": "tts_37.mp3", "Chua là すっぱい (suppai).": "tts_38.mp3", "ピクニックの日はいつがいいですか。（ ___ ）いいです。": "tts_39.mp3", "いつでも": "tts_40.mp3", "どこでも": "tts_41.mp3", "どっちでも": "tts_42.mp3", "Người ta hỏi いつ (Khi nào) thì trả lời là いつでも (Khi nào cũng được).": "tts_43.mp3"};

    function speakJP(text) {
        if (ttsMap[text]) {
            const a = new Audio(ttsMap[text]);
            a.play().catch(e=>console.log(e));
        }
    }


    function loadQuestion() {
        if (currentQuestionIndex >= questions.length) {
            ui.quizScreen.style.display = 'none';
            ui.header.style.display = 'none';
            ui.bottomBar.style.display = 'none';
            ui.endScreen.style.display = 'flex';
            return;
        }

        const q = questions[currentQuestionIndex];
        ui.title.innerText = q.title;
        ui.subtitle.innerText = q.subtitle;
        ui.content.innerText = q.content;
        
        // Auto-play question if it's Japanese
        setTimeout(() => speakJP(q.content), 300);

        ui.optionsContainer.innerHTML = '';
        selectedOption = null;
        isChecked = false;
        
        q.options.forEach((opt, index) => {
            const div = document.createElement('div');
            div.className = 'option';
            div.innerText = opt;
            div.onclick = () => {
                selectOption(div, index);
                speakJP(opt);
            };
            ui.optionsContainer.appendChild(div);
        });

        // Reset bottom bar
        ui.bottomBar.className = 'bottom-bar';
        ui.feedbackContainer.style.display = 'none';
        ui.btnCheck.className = 'btn-check';
        ui.btnCheck.innerText = 'Kiểm tra';
        
        // Update progress bar
        const progress = (currentQuestionIndex / questions.length) * 100;
        ui.progressBar.style.width = progress + '%';
    }

    function selectOption(el, index) {
        if (isChecked) return;
        
        document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
        el.classList.add('selected');
        selectedOption = index;
        
        ui.btnCheck.classList.add('active');
    }

    const audioCorrect = new Audio('duolingo-correct.mp3');
    const audioWrong = new Audio('duolingo-wrong.mp3');

    function playCorrectSound() {
        audioCorrect.currentTime = 0;
        audioCorrect.play().catch(e => console.log(e));
    }

    function playIncorrectSound() {
        audioWrong.currentTime = 0;
        audioWrong.play().catch(e => console.log(e));
    }

    function onCheckClick() {
        if (selectedOption === null) return;

        if (!isChecked) {
            // Check answer
            isChecked = true;
            const q = questions[currentQuestionIndex];
            const isCorrect = selectedOption === q.correct;
            
            ui.btnCheck.innerText = 'Tiếp tục';
            ui.feedbackContainer.style.display = 'block';
            ui.feedbackExplanation.innerText = q.explanation || "";

            // Disable all options
            document.querySelectorAll('.option').forEach(opt => opt.classList.add('disabled'));

            if (isCorrect) {
                ui.bottomBar.className = 'bottom-bar correct';
                ui.feedbackTitle.innerText = 'Chính xác! Làm tốt lắm!';
                playCorrectSound();
            } else {
                ui.bottomBar.className = 'bottom-bar incorrect';
                ui.feedbackTitle.innerText = 'Chưa đúng rồi!';
                playIncorrectSound();
                // Also highlight correct answer
                document.querySelectorAll('.option')[q.correct].style.borderColor = '#58cc02';
                document.querySelectorAll('.option')[q.correct].style.color = '#58cc02';
            }
        } else {
            // Move to next question
            const q = questions[currentQuestionIndex];
            if (selectedOption === q.correct) {
                currentQuestionIndex++;
            } else {
                // Duolingo logic: push failed question to the end of the array
                questions.push(questions.splice(currentQuestionIndex, 1)[0]);
                // do not increase currentQuestionIndex
            }
            loadQuestion();
        }
    }

    // Start
    loadQuestion();
</script>
</body>
</html>
