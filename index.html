<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marugoto A2 - Từ Vựng Bài 17 & 18</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-500: #22c55e; --green-600: #16a34a; --green-400: #4ade80;
            --neutral-200: #e5e7eb; --neutral-400: #a3a3a3;
            --gray: #e5e5e5; --gray-dark: #afafaf;
            --text-main: #3c3c3c;
            --blue: #1cb0f6; --blue-dark: #1899d6;
            --red: #ff4b4b; --red-dark: #ea2b2b;
            --gold: #ffc800; --bg: #ffffff;
            --purple: #a855f7; --purple-dark: #9333ea;
        }
        * { box-sizing: border-box; user-select: none; font-family: 'Nunito', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { display: flex; align-items: center; justify-content: space-between; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        .close-btn { cursor: pointer; font-size: 28px; color: var(--gray-dark); font-weight: 900; width: 40px; text-align: center; transition: 0.2s; }
        .progress-bar-bg { flex-grow: 1; background: var(--gray); height: 16px; border-radius: 8px; margin: 0 15px; position: relative; overflow: hidden; }
        .progress-bar-fill { background: var(--green-500); height: 100%; width: 0%; border-radius: 8px; transition: width 0.3s ease-out; position: relative; }
        
        main { flex-grow: 1; display: flex; flex-direction: column; max-width: 600px; margin: 0 auto; width: 100%; padding: 0 20px; overflow-y: auto; padding-bottom: 150px; }
        h1.title { font-size: 22px; font-weight: 800; margin-bottom: 20px; color: var(--text-main); text-align: center; }
        
        .audio-btn { background: var(--blue); color: #fff; border: none; border-radius: 50%; width: 52px; height: 52px; font-size: 22px; cursor: pointer; box-shadow: 0 4px 0 var(--blue-dark); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .audio-btn:active { transform: translateY(4px); box-shadow: none; }

        /* MCQ MODE */
        .btn-reveal {
            background: #f8fafc; color: var(--blue);
            border: 2px dashed var(--blue); border-radius: 16px;
            padding: 22px; font-size: 18px; font-weight: 800;
            width: 100%; cursor: pointer; transition: 0.2s; margin-top: 10px;
        }
        .btn-reveal:active { background: #e0f2fe; }

        .mcq-option {
            background: #fff; border: 2px solid var(--gray); border-bottom: 4px solid var(--gray);
            border-radius: 16px; padding: 18px 14px; font-size: 17px; font-weight: 800; color: var(--text-main);
            cursor: pointer; transition: 0.1s; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 70px;
        }
        .mcq-option:active { transform: translateY(2px); border-bottom-width: 2px; }
        .mcq-option.selected { border-color: var(--blue); background: #ddf4ff; color: var(--blue); }

        /* BOTTOM BAR */
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; padding: 18px 20px; border-top: 2px solid var(--gray); background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; }
        .bottom-bar.correct { background: #d7ffb8; border-color: #d7ffb8; }
        .bottom-bar.incorrect { background: #ffdfe0; border-color: #ffdfe0; }
        .bottom-content { max-width: 800px; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .feedback { display: none; flex-grow: 1; padding-right: 15px; }
        .feedback h2 { margin: 0 0 5px 0; font-size: 22px; font-weight: 900; }
        .bottom-bar.correct .feedback h2 { color: var(--green-600); }
        .bottom-bar.incorrect .feedback h2 { color: var(--red-dark); }
        .feedback .explanation { font-size: 15px; font-weight: 700; color: #444; line-height: 1.45; }
        .btn-check {
            background: var(--neutral-200); color: var(--neutral-400); border: none; border-radius: 16px; padding: 16px 32px; font-size: 17px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px; cursor: default; transition: 0.1s; min-width: 150px; border-bottom: 4px solid var(--neutral-200);
        }
        .btn-check.active { background: var(--green-500); color: white; cursor: pointer; border-bottom-color: var(--green-600); }
        .btn-check.active:active { border-bottom-width: 0; transform: translateY(4px); }
        .bottom-bar.incorrect .btn-check.active { background: var(--red); border-bottom-color: var(--red-dark); }

        /* START OVERLAY */
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding: 20px; }
        .unit-banner { background-color: var(--green-500); color: white; padding: 20px 24px; border-radius: 18px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 550px; box-shadow: 0 4px 0 var(--green-600); }
        .path-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 550px; padding-bottom: 50px; }
        
        .section-label { font-size: 16px; font-weight: 900; color: #64748b; background: #f1f5f9; padding: 8px 18px; border-radius: 20px; margin-top: 30px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

        .lesson-node-wrapper { position: relative; height: 102px; width: 102px; margin-top: 20px; display: flex; align-items: center; justify-content: center; }
        .lesson-button { width: 70px; height: 70px; border-radius: 50%; border: none; border-bottom: 8px solid; display: flex; align-items: center; justify-content: center; cursor: pointer; position: absolute; z-index: 2; transition: 0.1s; }
        .lesson-button.active-node, .lesson-button.completed { background-color: var(--green-500); border-bottom-color: var(--green-600); }
        .lesson-button.active-node:active, .lesson-button.completed:active { border-bottom-width: 0px; transform: translateY(8px); }
        .lesson-button.locked { background-color: var(--neutral-200); border-bottom-color: var(--neutral-400); cursor: not-allowed; }
        .lesson-icon { width: 34px; height: 34px; }
        .lesson-button.active-node .lesson-icon, .lesson-button.completed .lesson-icon { fill: white; stroke: white; color: white; stroke-width: 2; }
        .lesson-button.completed .lesson-icon { fill: none; stroke: white; stroke-width: 4; }
        .lesson-button.locked .lesson-icon { fill: var(--neutral-400); stroke: var(--neutral-400); color: var(--neutral-400); stroke-width: 2; }
        .progress-ring { position: absolute; top: 0; left: 0; width: 102px; height: 102px; transform: rotate(-90deg); z-index: 1; pointer-events: none; }
        
        .start-tooltip { position: absolute; top: -28px; left: 5px; z-index: 10; background-color: white; border: 2px solid var(--neutral-200); border-radius: 12px; padding: 8px 14px; font-weight: 900; font-size: 14px; color: var(--green-500); animation: bounce 2s infinite; white-space: nowrap; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } 60% { transform: translateY(-4px); } }
    </style>
</head>
<body>

<!-- SYNC MODAL -->
<div id="sync-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:10000; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#fff; border-radius:20px; padding:24px; width:100%; max-width:420px; display:flex; flex-direction:column; gap:16px; position:relative; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
        <button onclick="closeSyncModal()" style="position:absolute; top:15px; right:15px; background:none; border:none; font-size:24px; color:var(--gray-dark); cursor:pointer;">✖</button>
        <h2 style="margin:0; font-weight:900; color:var(--text-main); font-size:20px;">Đồng bộ dữ liệu học</h2>
        
        <div>
            <label style="font-weight:800; font-size:13px; color:var(--gray-dark);">MÃ XUẤT (Sao chép để chuyển sang điện thoại):</label>
            <textarea id="sync-export" readonly style="width:100%; height:60px; border:2px solid var(--gray); border-radius:10px; padding:8px; font-family:monospace; margin-top:5px; resize:none; font-size:12px;"></textarea>
            <button onclick="copySyncCode()" style="margin-top:8px; width:100%; padding:10px; background:var(--blue); color:white; border:none; border-radius:10px; font-weight:800; font-size:15px; cursor:pointer;">SAO CHÉP MÃ</button>
        </div>
        
        <div style="height:1px; background:var(--gray); margin:5px 0;"></div>
        
        <div>
            <label style="font-weight:800; font-size:13px; color:var(--gray-dark);">MÃ NHẬP (Dán mã từ thiết bị khác vào đây):</label>
            <textarea id="sync-import" style="width:100%; height:60px; border:2px solid var(--gray); border-radius:10px; padding:8px; font-family:monospace; margin-top:5px; resize:none; font-size:12px;" placeholder="Dán mã vào đây..."></textarea>
            <button onclick="importSyncCode()" style="margin-top:8px; width:100%; padding:10px; background:var(--green-500); color:white; border:none; border-radius:10px; font-weight:800; font-size:15px; cursor:pointer;">ĐỒNG BỘ NGAY</button>
        </div>
    </div>
</div>

<div id="start-overlay">
    <div class="unit-banner">
        <div>
            <h2 style="margin: 0; font-size: 22px; font-weight: 900;">Marugoto A2 - Bài 17 & 18</h2>
            <p style="margin: 5px 0 0 0; font-size: 15px; font-weight: 700; opacity: 0.95;">Trang 14 & 15 (Trọn bộ 58 từ vựng)</p>
        </div>
        <button onclick="openSyncModal()" style="background:rgba(255,255,255,0.25); border:none; border-radius:50%; width:44px; height:44px; font-size:20px; cursor:pointer; color:white; display:flex; align-items:center; justify-content:center;" title="Đồng bộ tiến trình">⚙️</button>
    </div>
    <div class="path-container" id="level-container"></div>
</div>

<header id="header" style="display:none;">
    <div style="display:flex; gap:15px; align-items:center;">
        <div class="close-btn" onclick="backToMap()" title="Thoát về lộ trình">✖</div>
        <div class="back-btn" onclick="goBack()" title="Quay lại câu trước" style="cursor:pointer; font-size:28px; color:var(--gray-dark); font-weight:900; transition:0.2s;">❮</div>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar"></div></div>
</header>

<main id="quiz-screen" style="display:none;">
    <h1 class="title" id="q-title">Chọn nghĩa tiếng Việt đúng</h1>
    
    <div id="mcq-mode" style="display:none; width: 100%; text-align: center;">
        <div style="display:flex; align-items:center; justify-content:center; gap: 15px; margin-bottom:10px;">
            <button class="audio-btn" onclick="playQuestionAudio()">🔊</button>
            <div style="font-size: 52px; font-weight: 900; color: var(--text-main);" id="mcq-kanji">漢字</div>
        </div>
        <div style="font-size: 24px; color: var(--blue); margin-bottom: 25px; font-weight: 800;" id="mcq-kana">かんじ</div>
        
        <!-- REVEAL BUTTON -->
        <button id="btn-reveal-options" class="btn-reveal" onclick="revealOptions()">👁 Bấm để hiện các đáp án</button>
        
        <div style="display: none; grid-template-columns: 1fr 1fr; gap: 14px;" id="mcq-options">
        </div>
    </div>
</main>

<main id="end-screen" style="display: none; align-items: center; justify-content: center; text-align: center; flex-direction:column; height: 100vh;">
    <div style="width: 150px; height: 150px; background: url('https://d35aaqx5ub95lt.cloudfront.net/images/owls/74bc0560a0ce733a1cc59cfaaa823053.svg') no-repeat center; background-size: contain;"></div>
    <h1 style="color:var(--gold); font-weight:900; font-size:36px; margin: 20px 0 10px 0;">Hoàn thành xuất sắc!</h1>
    <p style="font-size:18px; font-weight:700; color:#64748b;">Cậu đã ghi nhớ thêm từ vựng mới!</p>
    <button class="btn-check active" style="margin-top:30px; width:220px;" onclick="backToMap()">VỀ TRANG CHỦ</button>
</main>

<div class="bottom-bar" id="bottom-bar" style="display:none;">
    <div class="bottom-content">
        <div class="feedback" id="feedback-container">
            <h2 id="feedback-title">Chính xác!</h2>
            <div class="explanation" id="feedback-explanation">Mẹo: Nhớ kỹ nhé!</div>
        </div>
        <button class="btn-check" id="btn-check" onclick="onCheckClick()">KIỂM TRA</button>
    </div>
</div>

<script>
    const questions = [{"type": "mcq", "lesson": 17, "kanji": "赤ちゃん", "kana": "あかちゃん", "options": ["cần thiết", "em bé", "bữa tiệc", "giống"], "correct_index": 1, "mnemonic": "赤 (Xích = màu đỏ). Bé sơ sinh mới chào đời da dẻ hồng hào đỏ hỏn, nên người Nhật gọi là 'bé đỏ' (あかちゃん).", "han_viet": "XÍCH"}, {"type": "mcq", "lesson": 17, "kanji": "あげます", "kana": "あげます", "options": ["tốt nghiệp", "đưa, tặng", "giống", "coi trọng, trân trọng"], "correct_index": 1, "mnemonic": "上げます (Thượng - đưa lên). Khi tặng quà, người Nhật hai tay nâng món quà lên cung kính trao tặng.", "han_viet": "THƯỢNG"}, {"type": "mcq", "lesson": 17, "kanji": "遊びます", "kana": "あそびます", "options": ["hợp với ~", "áo len", "cần thiết", "chơi"], "correct_index": 3, "mnemonic": "遊 (Du trong du hí, du ngoạn). Trẻ con bước đi (bộ xước 辶) dạo chơi thỏa thích ngoài phố.", "han_viet": "DU"}, {"type": "mcq", "lesson": 17, "kanji": "色", "kana": "いろ", "options": ["màu sắc", "coi trọng, trân trọng", "bạn trai, người yêu", "vui sướng"], "correct_index": 0, "mnemonic": "色 (Sắc trong nhan sắc, màu sắc). Vạn vật thiên nhiên tỏa ra muôn ngàn sắc màu rực rỡ.", "han_viet": "SẮC"}, {"type": "mcq", "lesson": 17, "kanji": "生まれます", "kana": "うまれます", "options": ["được sinh ra", "mãi mãi về sau", "Ừ thì", "Chúc mừng!"], "correct_index": 0, "mnemonic": "生 (Sinh trong sinh đẻ, sinh ra). Mầm xanh đâm chồi nhú lên từ lòng đất = Sự sống mới được sinh ra.", "han_viet": "SINH"}, {"type": "mcq", "lesson": 17, "kanji": "お祝い", "kana": "おいわい", "options": ["lễ tình nhân", "chúc mừng", "tốt nghiệp", "bữa tiệc"], "correct_index": 1, "mnemonic": "祝 (Chúc trong chúc mừng, chúc phúc). Người anh trai (Huynh 兄) quỳ trước bàn thờ thần linh (Thị 礻) cầu chúc điềm lành.", "han_viet": "CHÚC"}, {"type": "mcq", "lesson": 17, "kanji": "同じ", "kana": "おなじ", "options": ["cà vạt", "giống", "lớp học", "kết hôn (cách nói lịch sự)"], "correct_index": 1, "mnemonic": "同 (Đồng trong đồng nhất, cùng nhau). Cùng ở trong một khuôn viên (冂) và nói cùng một miệng (口) = Giống nhau.", "han_viet": "ĐỒNG"}, {"type": "mcq", "lesson": 17, "kanji": "おもちゃ", "kana": "おもちゃ", "options": ["giỏi", "tốt bụng", "đồ chơi", "nhập học"], "correct_index": 2, "mnemonic": "玩具 (Ngoạn cụ - đồ chơi). Trẻ nhỏ cứ cầm 'ô-mô-cha' đồ chơi trên tay là cười khúc khích quên cả khóc.", "han_viet": "NGOẠN CỤ"}, {"type": "mcq", "lesson": 17, "kanji": "飾ります", "kana": "かざります", "options": ["chắc là, chắc chắn là", "tách cà phê", "hạnh phúc", "trang trí"], "correct_index": 3, "mnemonic": "飾 (Sức trong trang sức, tô điểm). Chuẩn bị món ăn ngon (Thực 食) và treo khăn hoa (Cân 巾) để trang hoàng nhà cửa.", "han_viet": "SỨC"}, {"type": "mcq", "lesson": 17, "kanji": "かばん", "kana": "かばん", "options": ["cặp sách, túi xách", "Giáng sinh", "(tiếng cười, chủ yếu của phụ nữ)", "ngày"], "correct_index": 0, "mnemonic": "鞄: Làm từ da (Cách 革) bao bọc (Bao 包) lấy tập vở sách bút đem đi làm, đi học.", "han_viet": "BẠO"}, {"type": "mcq", "lesson": 17, "kanji": "彼", "kana": "かれ", "options": ["em bé", "cặp sách, túi xách", "gia đình", "anh ấy, người yêu"], "correct_index": 3, "mnemonic": "彼 (Bỉ trong 'bỉ ngạn' - bờ bên kia). Người con trai đứng ở bờ bên kia chính là Anh ấy / Bạn trai.", "han_viet": "BỈ"}, {"type": "mcq", "lesson": 17, "kanji": "気", "kana": "き", "options": ["bạn trai, người yêu", "cảm giác", "màu sắc", "gia đình"], "correct_index": 1, "mnemonic": "気 (Khí trong tâm khí, khí chất). Nguồn cảm xúc, linh cảm và cảm giác toát ra từ bên trong.", "han_viet": "KHÍ"}, {"type": "mcq", "lesson": 17, "kanji": "気に入ります", "kana": "きにいります", "options": ["hợp sở thích, thích", "tốt bụng", "chơi", "cặp sách, túi xách"], "correct_index": 0, "mnemonic": "Khí (気 - tâm ý) + Nhập (入 - đi vào trong). Món đồ lọt trúng vào tâm ý mình -> Rất hợp sở thích, vô cùng vừa ý!", "han_viet": "KHÍ NHẬP"}, {"type": "mcq", "lesson": 17, "kanji": "着ます", "kana": "きます", "options": ["mặc", "Ừ thì", "phòng", "tốt bụng"], "correct_index": 0, "mnemonic": "着 (Trước trong y phục). Con cừu (Dương 羊) có bộ lông ấm áp khoác lên người (Mục 目) = Mặc áo giữ ấm.", "han_viet": "TRƯỚC"}, {"type": "mcq", "lesson": 17, "kanji": "クリスマス", "kana": "くりすます", "options": ["Chúc mừng!", "hạnh phúc", "cặp sách, túi xách", "Giáng sinh"], "correct_index": 3, "mnemonic": "Từ mượn tiếng Anh 'Christmas' -> Ngày lễ Noel Giáng Sinh 25/12 với cây thông và quà.", "han_viet": "CHRISTMAS"}, {"type": "mcq", "lesson": 17, "kanji": "結婚", "kana": "けっこん", "options": ["vui sướng", "quà tặng", "kết hôn", "tốt bụng"], "correct_index": 2, "mnemonic": "結 (Kết duyên bằng sợi tơ hồng) + 婚 (Hôn nhân - người phụ nữ tìm thấy bạn đời) -> Kết hôn nên vợ nên chồng.", "han_viet": "KẾT HÔN"}, {"type": "mcq", "lesson": 17, "kanji": "コーヒーカップ", "kana": "こーひーかっぷ", "options": ["chúc mừng", "tách cà phê", "chắc là, chắc chắn là", "lớp học"], "correct_index": 1, "mnemonic": "Từ mượn tiếng Anh 'Coffee cup' -> Tách sứ có quai chuyên dùng uống cà phê.", "han_viet": "COFFEE CUP"}, {"type": "mcq", "lesson": 17, "kanji": "シャツ", "kana": "しゃつ", "options": ["từ nay cũng", "gia đình", "áo sơ mi", "ngày"], "correct_index": 2, "mnemonic": "Từ mượn tiếng Anh 'Shirt' -> Chiếc áo sơ mi cổ bẻ lịch sự.", "han_viet": "SHIRT"}, {"type": "mcq", "lesson": 17, "kanji": "就職", "kana": "しゅうしょく", "options": ["sinh con", "tìm việc", "màu sắc", "thiệp"], "correct_index": 1, "mnemonic": "就 (Tựu = bước tới) + 職 (Chức = chức vụ, việc làm) -> Trúng tuyển đi làm, bắt đầu sự nghiệp.", "han_viet": "TỰU CHỨC"}, {"type": "mcq", "lesson": 17, "kanji": "出産", "kana": "しゅっさん", "options": ["sinh con", "đồ chơi", "quan trọng", "anh ấy, người yêu"], "correct_index": 0, "mnemonic": "出 (Xuất = ra ngoài) + 産 (Sản = sinh nở) -> Em bé chào đời chui ra ngoài thế giới -> Sinh con.", "han_viet": "XUẤT SẢN"}, {"type": "mcq", "lesson": 17, "kanji": "上手（な）", "kana": "じょうず", "options": ["quan trọng", "vui sướng", "giỏi", "tất cả, mọi người"], "correct_index": 2, "mnemonic": "上 (Thượng = trên cao) + 手 (Thủ = bàn tay) -> Bàn tay đạt trình độ cao siêu = Giỏi giang, khéo léo.", "han_viet": "THƯỢNG THỦ"}, {"type": "mcq", "lesson": 17, "kanji": "素敵（な）", "kana": "すてき", "options": ["sinh con", "Giáng sinh", "đưa, tặng", "xinh đẹp, tuyệt vời"], "correct_index": 3, "mnemonic": "Đẹp đến mức không có kẻ địch (敵) nào sánh nổi = Cực kỳ xinh đẹp, tuyệt vời.", "han_viet": "TỐ ĐỊCH"}, {"type": "mcq", "lesson": 17, "kanji": "セーター", "kana": "せーたー", "options": ["cảm giác", "áo len", "anh ấy, người yêu", "chắc là, chắc chắn là"], "correct_index": 1, "mnemonic": "Từ mượn tiếng Anh 'Sweater' -> Chiếc áo len đan sợi ấm áp mùa đông.", "han_viet": "SWEATER"}, {"type": "mcq", "lesson": 17, "kanji": "卒業", "kana": "そつぎょう", "options": ["tốt nghiệp", "gia đình", "Giáng sinh", "tốt bụng"], "correct_index": 0, "mnemonic": "卒 (Tốt = hoàn thành viên mãn) + 業 (Nghiệp = việc học) -> Hoàn thành việc học tập, nhận bằng tốt nghiệp.", "han_viet": "TỐT NGHIỆP"}, {"type": "mcq", "lesson": 17, "kanji": "例えば", "kana": "たとえば", "options": ["thiệp", "ví dụ", "áo sơ mi", "sinh con"], "correct_index": 1, "mnemonic": "例 (Lệ trong tiền lệ, thí dụ). Người (亻) đưa ra trường hợp cụ thể để so sánh giải thích = Ví dụ.", "han_viet": "LỆ"}, {"type": "mcq", "lesson": 17, "kanji": "たんじょう日", "kana": "たんじょうび", "options": ["tốt bụng", "sinh nhật", "tất cả, mọi người", "vui sướng, hạnh phúc"], "correct_index": 1, "mnemonic": "誕 (Đản = sinh ra đời) + 生 (Sinh) + 日 (Nhật = ngày) -> Ngày kỷ niệm sinh nhật chào đời.", "han_viet": "ĐẢN SINH NHẬT"}, {"type": "mcq", "lesson": 17, "kanji": "時計", "kana": "とけい", "options": ["gia đình", "đồng hồ", "chúc mừng", "Giáng sinh"], "correct_index": 1, "mnemonic": "時 (Thời = thời gian) + 計 (Kế = đo lường) -> Dụng cụ đo lường thời gian = Chiếc đồng hồ.", "han_viet": "THỜI KẾ"}, {"type": "mcq", "lesson": 17, "kanji": "似合います", "kana": "にあいます", "options": ["chúc mừng", "em bé", "nhập học", "hợp với ~"], "correct_index": 3, "mnemonic": "似 (Tự = tương đồng) + 合 (Hợp = vừa khít) -> Quần áo, phụ kiện rất vừa vặn, hợp với bạn.", "han_viet": "TỰ HỢP"}, {"type": "mcq", "lesson": 17, "kanji": "入学", "kana": "にゅうがく", "options": ["nhập học", "hạnh phúc", "kết hôn", "Giáng sinh"], "correct_index": 0, "mnemonic": "入 (Nhập = bước vào) + 学 (Học = trường học) -> Bước chân vào cổng trường dự lễ khai giảng nhập học.", "han_viet": "NHẬP HỌC"}, {"type": "mcq", "lesson": 17, "kanji": "ネクタイ", "kana": "ねくたい", "options": ["vòng cổ", "tốt bụng", "nghĩ", "cà vạt"], "correct_index": 3, "mnemonic": "Từ mượn tiếng Anh 'Necktie' (Neck = cổ, Tie = thắt) -> Dây thắt cà vạt ở cổ áo sơ mi.", "han_viet": "NECKTIE"}, {"type": "mcq", "lesson": 17, "kanji": "ネックレス", "kana": "ねっくれす", "options": ["bữa tiệc", "(tiếng cười, chủ yếu của phụ nữ)", "chúc mừng", "vòng cổ"], "correct_index": 3, "mnemonic": "Từ mượn tiếng Anh 'Necklace' -> Chuỗi vòng cổ dây chuyền lấp lánh.", "han_viet": "NECKLACE"}, {"type": "mcq", "lesson": 17, "kanji": "バレンタイン・デー", "kana": "ばれんたいんでー", "options": ["vui sướng", "lễ tình nhân", "lớp học", "hạnh phúc"], "correct_index": 1, "mnemonic": "Valentine's Day 14/2 ngày lễ tình nhân trao tặng nhau sô-cô-la ngọt ngào.", "han_viet": "VALENTINE"}, {"type": "mcq", "lesson": 17, "kanji": "（日）", "kana": "ひ", "options": ["tất cả, mọi người", "ngày", "kết hôn (cách nói lịch sự)", "tốt nghiệp"], "correct_index": 1, "mnemonic": "日 (Nhật). Hình tượng mặt trời tròn chiếu sáng -> Một ngày trôi qua khi mặt trời lên rồi lặn.", "han_viet": "NHẬT"}, {"type": "mcq", "lesson": 17, "kanji": "ふふふ", "kana": "ふふふ", "options": ["vui sướng, hạnh phúc", "(tiếng cười, chủ yếu của phụ nữ)", "tốt bụng", "hợp với ~"], "correct_index": 1, "mnemonic": "Âm thanh tiếng cười khúc khích, cười tủm tỉm duyên dáng của phái nữ 'fu fu fu'.", "han_viet": "TƯỢNG THANH"}, {"type": "mcq", "lesson": 17, "kanji": "プレゼント", "kana": "ぷれぜんと", "options": ["đồ chơi", "phòng", "quà tặng", "ví dụ"], "correct_index": 2, "mnemonic": "Từ mượn tiếng Anh 'Present' -> Hộp quà xinh xắn buộc nơ trao tặng người thân.", "han_viet": "PRESENT"}, {"type": "mcq", "lesson": 17, "kanji": "部屋", "kana": "へや", "options": ["từ nay cũng", "giống", "đồng hồ", "phòng"], "correct_index": 3, "mnemonic": "部 (Bộ = một phần) + 屋 (Ốc = căn nhà) -> Từng gian phòng riêng biệt bên trong một ngôi nhà.", "han_viet": "BỘ ỐC"}, {"type": "mcq", "lesson": 17, "kanji": "ボーイフレンド", "kana": "ぼーいふれんど", "options": ["vui sướng, hạnh phúc", "bạn trai, người yêu", "sinh nhật", "áo sơ mi"], "correct_index": 1, "mnemonic": "Từ mượn tiếng Anh 'Boyfriend' -> Bạn trai hoặc người yêu là nam giới.", "han_viet": "BOYFRIEND"}, {"type": "mcq", "lesson": 17, "kanji": "まあ", "kana": "まあ", "options": ["quà tặng", "Ừ thì", "đồng hồ", "mặc"], "correct_index": 1, "mnemonic": "Thán từ ngập ngừng, xoa dịu hoặc thể hiện thái độ ừ thì cũng tàm tạm.", "han_viet": "THÁN TỪ"}, {"type": "mcq", "lesson": 17, "kanji": "優しい", "kana": "やさしい", "options": ["kết hôn (cách nói lịch sự)", "em bé", "đưa, tặng", "tốt bụng"], "correct_index": 3, "mnemonic": "優 (Ưu trong ưu tú, ưu ái). Người (亻) luôn quan tâm lắng nghe, chăm sóc người khác = Tốt bụng, hiền từ.", "han_viet": "ƯU"}, {"type": "mcq", "lesson": 18, "kanji": "開けます", "kana": "あけます", "options": ["mở ra", "Chúc mừng!", "cảm giác", "tốt nghiệp"], "correct_index": 0, "mnemonic": "開 (Khai trong khai mở). Hai cánh cổng (Môn 門) được mở rộng ra đón ánh sáng vào nhà.", "han_viet": "KHAI"}, {"type": "mcq", "lesson": 18, "kanji": "いつまでも", "kana": "いつまでも", "options": ["anh ấy, người yêu", "giống", "mãi mãi về sau", "cặp sách, túi xách"], "correct_index": 2, "mnemonic": "いつ (khi nào) + まで (cho đến) + も (cũng) -> Dù đến tận bao giờ đi nữa = Mãi mãi về sau.", "han_viet": "PHÓ TỪ"}, {"type": "mcq", "lesson": 18, "kanji": "嬉しい", "kana": "うれしい", "options": ["bạn trai, người yêu", "đưa, tặng", "phòng", "vui sướng"], "correct_index": 3, "mnemonic": "嬉 (Hi trong hoan hỉ). Người phụ nữ (Nữ 女) nhận tin vui mừng rỡ reo hò (Hỉ 喜) = Vui sướng.", "han_viet": "HI"}, {"type": "mcq", "lesson": 18, "kanji": "おめでとう", "kana": "おめでとう", "options": ["xinh đẹp, tuyệt vời", "Chúc mừng!", "hợp với ~", "bạn trai, người yêu"], "correct_index": 1, "mnemonic ": "mcq", "lesson": 18, "kanji": "喜びます", "kana": "よろこびます", "options": ["hợp sở thích, thích", "vui sướng, hạnh phúc", "bữa tiệc", "đồ chơi"], "correct_index": 1, "mnemonic": "喜 (Hỉ trong song hỉ, hoan hỉ). Gõ trống ca hát (Sĩ + Đậu) miệng cười tươi (Khẩu) = Mừng rỡ khôn xiết.", "han_viet": "HỈ"}];
    const ttsMap = {"あかちゃん": "tts_0.mp3", "あげます": "tts_1.mp3", "あそびます": "tts_2.mp3", "いろ": "tts_3.mp3", "うまれます": "tts_4.mp3", "おいわい": "tts_5.mp3", "おなじ": "tts_6.mp3", "おもちゃ": "tts_7.mp3", "かざります": "tts_8.mp3", "かばん": "tts_9.mp3", "かれ": "tts_10.mp3", "き": "tts_11.mp3", "きにいります": "tts_12.mp3", "きます": "tts_13.mp3", "くりすます": "tts_14.mp3", "けっこん": "tts_15.mp3", "こーひーかっぷ": "tts_16.mp3", "しゃつ": "tts_17.mp3", "しゅうしょく": "tts_18.mp3", "しゅっさん": "tts_19.mp3", "じょうず": "tts_20.mp3", "すてき": "tts_21.mp3", "せーたー": "tts_22.mp3", "そつぎょう": "tts_23.mp3", "たとえば": "tts_24.mp3", "たんじょうび": "tts_25.mp3", "とけい": "tts_26.mp3", "にあいます": "tts_27.mp3", "にゅうがく": "tts_28.mp3", "ねくたい": "tts_29.mp3", "ねっくれす": "tts_30.mp3", "ばれんたいんでー": "tts_31.mp3", "ひ": "tts_32.mp3", "ふふふ": "tts_33.mp3", "ぷれぜんと": "tts_34.mp3", "へや": "tts_35.mp3", "ぼーいふれんど": "tts_36.mp3", "まあ": "tts_37.mp3", "やさしい": "tts_38.mp3", "あけます": "tts_39.mp3", "いつまでも": "tts_40.mp3", "うれしい": "tts_41.mp3", "おめでとう": "tts_42.mp3", "おもいます": "tts_43.mp3", "かーど": "tts_44.mp3", "かてい": "tts_45.mp3", "きっと": "tts_46.mp3", "くらす": "tts_47.mp3", "ごけっこん": "tts_48.mp3", "これからも": "tts_49.mp3", "しあわせ": "tts_50.mp3", "たいせつ": "tts_51.mp3", "たいせつにします": "tts_52.mp3", "ぱーてぃー": "tts_53.mp3", "ひっこし": "tts_54.mp3", "ひつよう": "tts_55.mp3", "みんな": "tts_56.mp3", "よろこびます": "tts_57.mp3"};

    let activeQuestions = [];
    let currentLevelIndex = 0;
    let currentQuestionIndex = 0;
    
    let isChecked = false;
    let selectedOptionIndex = -1;
    let historyStack = [];
    
    const STORAGE_COMPLETED = 'marugoto_17_18_completed';
    const STORAGE_SESSION = 'marugoto_17_18_session';
    
    let completedLevels = JSON.parse(localStorage.getItem(STORAGE_COMPLETED) || '[]');

    const ui = {
        quizScreen: document.getElementById('quiz-screen'),
        mcqMode: document.getElementById('mcq-mode'),
        mcqKanji: document.getElementById('mcq-kanji'),
        mcqKana: document.getElementById('mcq-kana'),
        mcqOptions: document.getElementById('mcq-options'),
        btnReveal: document.getElementById('btn-reveal-options'),
        btnCheck: document.getElementById('btn-check'),
        bottomBar: document.getElementById('bottom-bar'),
        feedbackContainer: document.getElementById('feedback-container'),
        feedbackExplanation: document.getElementById('feedback-explanation'),
        feedbackTitle: document.getElementById('feedback-title'),
        progressBar: document.getElementById('progress-bar')
    };

    const audioCorrect = new Audio('duolingo-correct.mp3');
    const audioWrong = new Audio('duolingo-wrong.mp3');
    let currentAudio = null;

    function saveSession() {
        const sessionData = {
            levelIndex: currentLevelIndex,
            questionIndex: currentQuestionIndex,
            activeQuestions: activeQuestions,
            history: historyStack
        };
        localStorage.setItem(STORAGE_SESSION, JSON.stringify(sessionData));
    }

    function clearSession() {
        localStorage.removeItem(STORAGE_SESSION);
    }

    function speakJP(text) {
        const key = text.replace(/ /g, '');
        if (ttsMap[key]) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            currentAudio = new Audio(ttsMap[key]);
            currentAudio.play().catch(e=>console.log(e));
        }
    }

    function playQuestionAudio() {
        const q = activeQuestions[currentQuestionIndex];
        speakJP(q.kana);
    }

    function revealOptions() {
        ui.btnReveal.style.display = 'none';
        ui.mcqOptions.style.display = 'grid';
    }

    function renderLevels() {
        const container = document.getElementById('level-container');
        container.innerHTML = '';
        
        // Split questions into Bài 17 and Bài 18
        const q17 = questions.filter(q => q.lesson === 17);
        const q18 = questions.filter(q => q.lesson === 18);
        
        const num17 = Math.ceil(q17.length / 5); // 39 / 5 = 8 levels (levels 0..7)
        const num18 = Math.ceil(q18.length / 5); // 19 / 5 = 4 levels (levels 8..11)
        const totalLevels = num17 + num18;

        let activeLevel = 0;
        while(completedLevels.includes(activeLevel) && activeLevel < totalLevels) activeLevel++;
        if(activeLevel >= totalLevels) activeLevel = totalLevels - 1;

        // Label Bài 17
        const label17 = document.createElement('div');
        label17.className = 'section-label';
        label17.innerText = '🌸 BÀI 17: CỘT MỐC CUỘC ĐỜI & QUÀ TẶNG (39 TỪ)';
        container.appendChild(label17);

        for(let i=0; i<totalLevels; i++) {
            if (i === num17) {
                // Label Bài 18
                const label18 = document.createElement('div');
                label18.className = 'section-label';
                label18.innerText = '🎉 BÀI 18: LỜI CHÚC & TƯƠNG LAI (19 TỪ)';
                container.appendChild(label18);
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'lesson-node-wrapper';
            const offset = (i % 4 === 0) ? 0 : (i % 4 === 1 || i % 4 === 3) ? -35 : -55;
            wrapper.style.right = offset + 'px';

            const isCompleted = completedLevels.includes(i);
            const isActive = (i === activeLevel);
            const isLocked = !isCompleted && !isActive;

            const btn = document.createElement('button');
            btn.className = 'lesson-button ' + (isCompleted ? 'completed' : isActive ? 'active-node' : 'locked');
            
            if (isActive) {
                btn.innerHTML = '<svg class="lesson-icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>';
                const ring = document.createElement('div');
                ring.innerHTML = `<svg width="102" height="102" viewBox="0 0 102 102" class="progress-ring"><circle cx="51" cy="51" r="46" stroke="var(--neutral-200)" stroke-width="8" fill="none" /><circle cx="51" cy="51" r="46" stroke="var(--green-400)" stroke-width="8" fill="none" stroke-dasharray="289" stroke-dashoffset="231" stroke-linecap="round" /></svg>`;
                wrapper.appendChild(ring.firstElementChild);
                const tooltip = document.createElement('div'); tooltip.className = 'start-tooltip'; tooltip.innerText = `ẢI ${i + 1}: START`; wrapper.appendChild(tooltip);
            } else if (isCompleted) {
                btn.innerHTML = '<svg class="lesson-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>';
            } else {
                btn.innerHTML = '<svg class="lesson-icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>';
            }
            
            if(!isLocked) btn.onclick = () => startLevel(i);
            wrapper.appendChild(btn); 
            container.appendChild(wrapper);
        }

        // Final Crown Node for Full Random Review
        const finalWrapper = document.createElement('div');
        finalWrapper.className = 'lesson-node-wrapper';
        finalWrapper.style.right = '0px';
        finalWrapper.style.marginTop = '40px';
        const finalBtn = document.createElement('button');
        finalBtn.className = 'lesson-button active-node';
        finalBtn.style.backgroundColor = 'var(--gold)';
        finalBtn.style.borderBottomColor = '#d4a000';
        finalBtn.innerHTML = '<span style="font-size:32px;">👑</span>';
        finalBtn.onclick = () => startFinalReview();
        const finalRing = document.createElement('div');
        finalRing.innerHTML = `<svg width="102" height="102" viewBox="0 0 102 102" class="progress-ring"><circle cx="51" cy="51" r="46" stroke="var(--neutral-200)" stroke-width="8" fill="none" /><circle cx="51" cy="51" r="46" stroke="var(--gold)" stroke-width="8" fill="none" stroke-dasharray="289" stroke-dashoffset="0" stroke-linecap="round" /></svg>`;
        finalWrapper.appendChild(finalRing.firstElementChild);
        const finalTooltip = document.createElement('div'); 
        finalTooltip.className = 'start-tooltip'; 
        finalTooltip.innerText = '👑 ÔN TỔNG HỢP 58 TỪ'; 
        finalTooltip.style.color = 'var(--gold)'; 
        finalTooltip.style.borderColor = 'var(--gold)'; 
        finalTooltip.style.left = '-35px';
        finalWrapper.appendChild(finalTooltip);
        finalWrapper.appendChild(finalBtn); 
        container.appendChild(finalWrapper);
    }

    function startLevel(index) {
        currentLevelIndex = index;
        const start = index * 5;
        activeQuestions = JSON.parse(JSON.stringify(questions.slice(start, start + 5)));
        currentQuestionIndex = 0;
        historyStack = [];
        saveSession();
        
        document.getElementById('start-overlay').style.display = 'none';
        document.getElementById('header').style.display = 'flex';
        ui.quizScreen.style.display = 'flex';
        ui.bottomBar.style.display = 'flex';
        loadQuestion();
    }

    function startFinalReview() {
        currentLevelIndex = 'FINAL';
        let allQ = JSON.parse(JSON.stringify(questions));
        allQ.sort(() => Math.random() - 0.5);
        activeQuestions = allQ;
        currentQuestionIndex = 0;
        historyStack = [];
        saveSession();
        
        document.getElementById('start-overlay').style.display = 'none';
        document.getElementById('header').style.display = 'flex';
        ui.quizScreen.style.display = 'flex';
        ui.bottomBar.style.display = 'flex';
        loadQuestion();
    }

    function goBack() {
        if (historyStack.length > 0) {
            const prevState = historyStack.pop();
            currentQuestionIndex = prevState.qIndex;
            activeQuestions = prevState.activeQ;
            saveSession();
            loadQuestion();
        }
    }

    function loadQuestion() {
        if (currentQuestionIndex >= activeQuestions.length) {
            if(currentLevelIndex !== 'FINAL' && !completedLevels.includes(currentLevelIndex)) {
                completedLevels.push(currentLevelIndex);
                localStorage.setItem(STORAGE_COMPLETED, JSON.stringify(completedLevels));
            }
            clearSession();
            ui.quizScreen.style.display = 'none'; 
            document.getElementById('header').style.display = 'none'; 
            ui.bottomBar.style.display = 'none';
            document.getElementById('end-screen').style.display = 'flex'; 
            return;
        }
        
        const q = activeQuestions[currentQuestionIndex];
        isChecked = false;
        selectedOptionIndex = -1;
        ui.bottomBar.className = 'bottom-bar'; 
        ui.feedbackContainer.style.display = 'none';
        ui.btnCheck.className = 'btn-check'; 
        ui.btnCheck.innerText = 'KIỂM TRA';
        ui.progressBar.style.width = ((currentQuestionIndex / activeQuestions.length) * 100) + '%';
        
        renderCurrentQuestion();
        playQuestionAudio();
    }

    function renderCurrentQuestion() {
        const q = activeQuestions[currentQuestionIndex];
        
        ui.btnReveal.style.display = 'block';
        ui.mcqOptions.style.display = 'none';
        
        ui.mcqMode.style.display = 'block';
        ui.mcqKanji.innerText = q.kanji;
        ui.mcqKana.innerText = q.kana;
        ui.mcqOptions.innerHTML = '';
        
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('div');
            btn.className = 'mcq-option';
            if (idx === selectedOptionIndex) btn.classList.add('selected');
            btn.innerText = opt;
            btn.onclick = () => {
                if (isChecked) return;
                selectedOptionIndex = idx;
                renderCurrentQuestionAfterSelect();
            };
            ui.mcqOptions.appendChild(btn);
        });
        
        if (selectedOptionIndex !== -1) {
            ui.btnCheck.classList.add('active');
        } else {
            ui.btnCheck.classList.remove('active');
        }
    }

    function renderCurrentQuestionAfterSelect() {
        const optionEls = ui.mcqOptions.querySelectorAll('.mcq-option');
        optionEls.forEach((el, idx) => {
            if (idx === selectedOptionIndex) el.classList.add('selected');
            else el.classList.remove('selected');
        });
        if (selectedOptionIndex !== -1) {
            ui.btnCheck.classList.add('active');
        }
    }

    function onCheckClick() {
        const q = activeQuestions[currentQuestionIndex];
        if (!ui.btnCheck.classList.contains('active')) return;

        if (!isChecked) {
            isChecked = true;
            ui.btnCheck.innerText = 'TIẾP TỤC';
            ui.feedbackContainer.style.display = 'block';
            
            // Auto reveal options if not revealed yet
            revealOptions();

            const isCorrect = (selectedOptionIndex === q.correct_index);
            const hanVietText = q.han_viet ? `<b>Âm Hán Việt:</b> <span style="color:var(--gold); font-weight:900;">${q.han_viet}</span><br><br>` : '';

            if (isCorrect) {
                ui.bottomBar.className = 'bottom-bar correct';
                ui.feedbackTitle.innerText = 'Tuyệt vời!';
                ui.feedbackExplanation.innerHTML = `${hanVietText}<b>Mẹo nhớ:</b> ${q.mnemonic}`;
                audioCorrect.currentTime = 0; audioCorrect.play().catch(e=>e);
            } else {
                ui.bottomBar.className = 'bottom-bar incorrect';
                ui.feedbackTitle.innerText = 'Chưa đúng rồi!';
                ui.feedbackExplanation.innerHTML = `<b>Đáp án đúng:</b> <span style="color:var(--green-600); font-weight:900;">${q.options[q.correct_index]}</span><br><br>${hanVietText}<b>Mẹo nhớ:</b> ${q.mnemonic}`;
                audioWrong.currentTime = 0; audioWrong.play().catch(e=>e);
            }
        } else {
            historyStack.push({
                qIndex: currentQuestionIndex,
                activeQ: JSON.parse(JSON.stringify(activeQuestions))
            });

            const isCorrect = (selectedOptionIndex === q.correct_index);
            if (isCorrect) currentQuestionIndex++;
            else activeQuestions.push(activeQuestions.splice(currentQuestionIndex, 1)[0]);
            
            saveSession();
            loadQuestion();
        }
    }

    function backToMap() {
        if(document.getElementById('quiz-screen').style.display !== 'none' && !confirm("Cậu có chắc muốn thoát? Quá trình câu này sẽ tạm dừng.")) return;
        clearSession();
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('header').style.display = 'none';
        document.getElementById('bottom-bar').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('start-overlay').style.display = 'flex';
        renderLevels();
    }

    // Sync Features
    function openSyncModal() {
        document.getElementById('sync-modal').style.display = 'flex';
        const data = {
            completed: localStorage.getItem(STORAGE_COMPLETED) || '[]',
            session: localStorage.getItem(STORAGE_SESSION) || ''
        };
        document.getElementById('sync-export').value = btoa(encodeURIComponent(JSON.stringify(data)));
    }
    function closeSyncModal() {
        document.getElementById('sync-modal').style.display = 'none';
    }
    function copySyncCode() {
        const copyText = document.getElementById('sync-export');
        copyText.select();
        document.execCommand('copy');
        alert('Đã sao chép mã đồng bộ!');
    }
    function importSyncCode() {
        const code = document.getElementById('sync-import').value.trim();
        if (!code) return;
        try {
            const data = JSON.parse(decodeURIComponent(atob(code)));
            if (data.completed) localStorage.setItem(STORAGE_COMPLETED, data.completed);
            if (data.session) localStorage.setItem(STORAGE_SESSION, data.session);
            alert('Đồng bộ thành công! Trang sẽ tải lại.');
            location.reload();
        } catch(e) {
            alert('Mã đồng bộ không hợp lệ!');
        }
    }

    window.onload = () => {
        renderLevels();
        const saved = localStorage.getItem(STORAGE_SESSION);
        if (saved) {
            try {
                const data = JSON.parse(saved);
                currentLevelIndex = data.levelIndex;
                currentQuestionIndex = data.questionIndex;
                activeQuestions = data.activeQuestions;
                historyStack = data.history || [];
                
                document.getElementById('start-overlay').style.display = 'none';
                document.getElementById('header').style.display = 'flex';
                ui.quizScreen.style.display = 'flex';
                ui.bottomBar.style.display = 'flex';
                loadQuestion();
            } catch(e) {}
        }
    };
</script>
