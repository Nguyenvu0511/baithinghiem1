<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duolingo Clone - JAP 183 Kaiwa Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-500: #22c55e; --green-600: #16a34a; --green-400: #4ade80;
            --neutral-200: #e5e7eb; --neutral-400: #a3a3a3;
            --gray: #e5e5e5; --gray-dark: #afafaf;
            --text-main: #3c3c3c;
            --blue: #1cb0f6; --blue-dark: #1899d6;
            --red: #ff4b4b; --red-dark: #ea2b2b;
            --gold: #ffc800; --bg: #ffffff;
        }
        * { box-sizing: border-box; user-select: none; font-family: 'Nunito', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* HEADER */
        header { display: flex; align-items: center; justify-content: space-between; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        .close-btn { cursor: pointer; font-size: 28px; color: var(--gray-dark); font-weight: 900; width: 40px; text-align: center; transition: 0.2s; }
        .progress-bar-bg { flex-grow: 1; background: var(--gray); height: 16px; border-radius: 8px; margin: 0 15px; position: relative; overflow: hidden; }
        .progress-bar-fill { background: var(--green-500); height: 100%; width: 0%; border-radius: 8px; transition: width 0.3s ease-out; position: relative; }
        
        /* TOGGLE BUTTON */
        .toggle-btn {
            background: #fff; border: 2px solid var(--gray); border-bottom: 4px solid var(--gray);
            border-radius: 10px; padding: 5px 10px; font-weight: 900; color: var(--gray-dark);
            cursor: pointer; font-size: 14px;
        }
        .toggle-btn.active { border-color: var(--blue); color: var(--blue); background: #ddf4ff; }
        .toggle-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        /* MAIN */
        main { flex-grow: 1; display: flex; flex-direction: column; max-width: 600px; margin: 0 auto; width: 100%; padding: 0 20px; overflow-y: auto; padding-bottom: 150px; }
        h1.title { font-size: 24px; font-weight: 800; margin-bottom: 20px; color: var(--text-main); }
        
        .mascot-area { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 30px; }
        .mascot { width: 80px; height: 100px; background: url('https://d35aaqx5ub95lt.cloudfront.net/images/owls/74bc0560a0ce733a1cc59cfaaa823053.svg') no-repeat center; background-size: contain; flex-shrink: 0; }
        .speech-bubble {
            border: 2px solid var(--gray); border-radius: 15px; padding: 15px 20px; position: relative;
            font-size: 22px; font-weight: 700; flex-grow: 1; min-height: 80px; display: flex; align-items: center;
        }
        .speech-bubble::before { content: ''; position: absolute; left: -10px; top: 20px; border-width: 10px 12px 10px 0; border-style: solid; border-color: transparent var(--gray) transparent transparent; }
        .speech-bubble::after { content: ''; position: absolute; left: -7px; top: 20px; border-width: 8px 10px 8px 0; border-style: solid; border-color: transparent #fff transparent transparent; }

        .audio-btn { background: var(--blue); color: #fff; border: none; border-radius: 12px; padding: 10px; font-size: 20px; cursor: pointer; box-shadow: 0 4px 0 var(--blue-dark); margin-right: 15px; }
        .audio-btn:active { transform: translateY(4px); box-shadow: none; }

        /* READING MODE */
        .flashcard {
            border: 2px solid var(--gray); border-radius: 15px; padding: 40px 20px; text-align: center;
            font-size: 28px; font-weight: 900; margin-bottom: 30px; cursor: pointer; border-bottom: 6px solid var(--gray);
            background: #fff; transition: 0.1s;
        }
        .flashcard:active { transform: translateY(4px); border-bottom-width: 2px; }
        .flashcard-reveal { font-size: 18px; color: var(--blue); font-weight: 700; margin-top: 15px; }

        /* SORTING MODE */
        .drop-zone {
            display: flex; flex-wrap: wrap; gap: 10px; min-height: 60px; padding: 10px 0;
            border-bottom: 2px solid var(--gray); margin-bottom: 20px;
        }
        .word-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .word-chunk {
            background: #fff; border: 2px solid var(--gray); border-bottom: 4px solid var(--gray);
            border-radius: 12px; padding: 10px 15px; font-size: 20px; font-weight: 700;
            cursor: pointer; transition: 0.1s; display: inline-block;
        }
        .word-chunk:active { transform: translateY(2px); border-bottom-width: 2px; }
        .word-chunk.placeholder { background: var(--gray); border-color: var(--gray); color: transparent; pointer-events: none; }

        /* BOTTOM BAR */
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px; border-top: 2px solid var(--gray); background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; }
        .bottom-bar.correct { background: #d7ffb8; border-color: #d7ffb8; }
        .bottom-bar.incorrect { background: #ffdfe0; border-color: #ffdfe0; }
        .bottom-content { max-width: 800px; width: 100%; display: flex; align-items: center; justify-content: space-between; }
        .feedback { display: none; flex-grow: 1; padding-right: 15px; }
        .feedback h2 { margin: 0 0 5px 0; font-size: 24px; font-weight: 900; }
        .bottom-bar.correct .feedback h2 { color: var(--green-600); }
        .bottom-bar.incorrect .feedback h2 { color: var(--red-dark); }
        .feedback .explanation { font-size: 16px; font-weight: 700; color: #777; }
        .btn-check {
            background: var(--neutral-200); color: var(--neutral-400); border: none; border-radius: 15px; padding: 15px 30px; font-size: 18px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px; cursor: default; transition: 0.1s; min-width: 150px; border-bottom: 4px solid var(--neutral-200);
        }
        .btn-check.active { background: var(--green-500); color: white; cursor: pointer; border-bottom-color: var(--green-600); }
        .btn-check.active:active { border-bottom-width:0; transform: translateY(4px); }
        .bottom-bar.incorrect .btn-check.active { background: var(--red); border-bottom-color: var(--red-dark); }

        /* START OVERLAY */
        #start-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: #fff; z-index:9999; display:flex; flex-direction:column; align-items:center; overflow-y: auto; padding: 20px; }
        .unit-banner { background-color: var(--green-500); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 550px; }
        .path-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 550px; padding-bottom: 50px; }
        
        .lesson-node-wrapper { position: relative; height: 102px; width: 102px; margin-top: 24px; display: flex; align-items: center; justify-content: center; }
        .lesson-button { width: 70px; height: 70px; border-radius: 50%; border: none; border-bottom: 8px solid; display: flex; align-items: center; justify-content: center; cursor: pointer; position: absolute; z-index: 2; transition: 0.1s; }
        .lesson-button.active-node, .lesson-button.completed { background-color: var(--green-500); border-bottom-color: var(--green-600); }
        .lesson-button.active-node:active, .lesson-button.completed:active { border-bottom-width: 0px; transform: translateY(8px); }
        .lesson-button.locked { background-color: var(--neutral-200); border-bottom-color: var(--neutral-400); cursor: not-allowed; }
        .lesson-icon { width: 36px; height: 36px; }
        .lesson-button.active-node .lesson-icon, .lesson-button.completed .lesson-icon { fill: white; stroke: white; color: white; stroke-width: 2; }
        .lesson-button.completed .lesson-icon { fill: none; stroke: white; stroke-width: 4; }
        .lesson-button.locked .lesson-icon { fill: var(--neutral-400); stroke: var(--neutral-400); color: var(--neutral-400); stroke-width: 2; }
        .progress-ring { position: absolute; top: 0; left: 0; width: 102px; height: 102px; transform: rotate(-90deg); z-index: 1; pointer-events: none; }
        
        .start-tooltip { position: absolute; top: -28px; left: 5px; z-index: 10; background-color: white; border: 2px solid var(--neutral-200); border-radius: 12px; padding: 8px 12px; font-weight: 900; font-size: 15px; color: var(--green-500); animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } 60% { transform: translateY(-5px); } }
        
        .listen-btn {
            background: var(--blue);
            width: 80px; height: 80px; font-size: 30px; border-radius: 50%;
            margin: 0 auto; border: none; cursor: pointer; color: white;
            box-shadow: 0 6px 0 var(--blue-dark); transition: 0.1s;
        }
        .listen-btn:active {
            transform: translateY(4px); box-shadow: 0 2px 0 var(--blue-dark);
        }
        
        @keyframes micPulse {
            0% { box-shadow: 0 6px 0 var(--red-dark), 0 0 0 0 rgba(255, 75, 75, 0.7); }
            70% { box-shadow: 0 6px 0 var(--red-dark), 0 0 0 25px rgba(255, 75, 75, 0); }
            100% { box-shadow: 0 6px 0 var(--red-dark), 0 0 0 0 rgba(255, 75, 75, 0); }
        }
        
        .mic-recording {
            background: var(--red) !important;
            animation: micPulse 1.5s infinite !important;
        }
    </style>
</head>
<body>

<div id="start-overlay">
    <div class="unit-banner">
        <div>
            <h2 style="margin: 0; font-size: 22px; font-weight: 900;">JAP 183 Kaiwa</h2>
            <p style="margin: 5px 0 0 0; font-size: 17px; font-weight: 700; opacity: 0.9;">Bài thi giữa kỳ (20 câu)</p>
        </div>
    </div>
    <div class="path-container" id="level-container"></div>
</div>

<header id="header" style="display:none;">
    <div style="display:flex; gap:15px; align-items:center;">
        <div class="close-btn" onclick="backToMap()" title="Thoát">✖</div>
        <div class="back-btn" onclick="goBack()" title="Quay lại" style="cursor:pointer; font-size:28px; color:var(--gray-dark); font-weight:900; transition:0.2s;">❮</div>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar"></div></div>
    <button class="toggle-btn" id="btn-toggle" onclick="toggleKana()">あ/漢</button>
</header>

<main id="quiz-screen" style="display:none;">
    <h1 class="title" id="q-title">Phát âm câu sau</h1>
    
    <div id="reading-mode" style="display:none; width: 100%; text-align: center;">
        <div class="flashcard" id="flashcard" onclick="flipCard()">
            <div id="fc-text">Kanji text</div>
            <div class="flashcard-reveal" id="fc-reveal" style="display:none;">Tap to reveal</div>
        </div>
        <div id="mic-container" style="margin-top: 20px;">
            <button id="btn-mic" class="listen-btn">🎤</button>
            <div id="speech-result" style="margin-top: 20px; font-weight: 800; font-size: 18px; color: var(--gray-dark);">Bấm Mic để nói. Xong thì bấm nút KIỂM TRA.</div>
            <button onclick="skipSpeaking()" style="margin-top:20px; background:none; border:none; color:var(--neutral-400); font-weight:700; font-size:16px; cursor:pointer; text-decoration:underline;">Không thể nói lúc này</button>
        </div>
    </div>

    <div id="sorting-mode" style="display:none; width: 100%;">
        <div class="mascot-area">
            <div class="mascot"></div>
            <div class="speech-bubble">
                <button class="audio-btn" onclick="playQuestionAudio()">🔊</button>
                <span id="q-speech">Question</span>
            </div>
        </div>
        <div class="drop-zone" id="drop-zone"></div>
        <div class="word-bank" id="word-bank"></div>
    </div>
</main>

<main id="end-screen" style="display: none; align-items: center; justify-content: center; text-align: center; flex-direction:column; height: 100vh;">
    <div style="width: 150px; height: 150px; background: url('https://d35aaqx5ub95lt.cloudfront.net/images/owls/74bc0560a0ce733a1cc59cfaaa823053.svg') no-repeat center; background-size: contain;"></div>
    <h1 style="color:var(--gold); font-weight:900; font-size:36px;">Hoàn thành!</h1>
    <button class="btn-check active" style="margin-top:40px; width:200px;" onclick="backToMap()">VỀ TRANG CHỦ</button>
</main>

<div class="bottom-bar" id="bottom-bar" style="display:none;">
    <div class="bottom-content">
        <div class="feedback" id="feedback-container">
            <h2 id="feedback-title">Chính xác!</h2>
            <div class="explanation" id="feedback-explanation">Mẹo: Nhớ kỹ nhé!</div>
        </div>
        <button class="btn-check" id="btn-check" onclick="onCheckClick()">KIỂM TRA</button>
    </div>
</div>

<script>
    const questions = [{"id": 1, "type": "reading", "q_kanji": "たなかさんに 東京で 会ったことがあります。", "q_kana": "たなかさんに とうきょうで あったことがあります。", "vi": "Tôi đã từng gặp anh Tanaka ở Tokyo."}, {"id": 2, "type": "reading", "q_kanji": "このコピーき を 使ってもいいですか。", "q_kana": "このコピーきを つかってもいいですか。", "vi": "Tôi có thể sử dụng máy photocopy này được không?"}, {"id": 3, "type": "reading", "q_kanji": "食事のとき、おはしとフォークと どちらがいいですか。", "q_kana": "しょくじのとき、おはしとフォークと どちらがいいですか。", "vi": "Khi ăn, đũa và dĩa cái nào tốt hơn?"}, {"id": 4, "type": "reading", "q_kanji": "私はコンピューターの 会社で はたらいています。", "q_kana": "わたしはコンピューターの かいしゃで はたらいています。", "vi": "Tôi đang làm việc tại một công ty máy tính."}, {"id": 5, "type": "reading", "q_kanji": "私は毎日、うちから 駅まで 30分ぐらい 歩きます。", "q_kana": "わたしはまいにち、うちから えきまで 30ぷんぐらい あるきます。", "vi": "Hàng ngày tôi đi bộ từ nhà đến ga khoảng 30 phút."}, {"id": 6, "type": "sorting", "q_kanji": "いま 何を いちばんしたいですか。", "q_kana": "いま なにを いちばんしたいですか。", "a_kanji_chunks": ["いま、", "日本へ", "行きたい", "です。"], "a_kana_chunks": ["いま、", "にほんへ", "いきたい", "です。"], "vi": "Bây giờ bạn muốn làm gì nhất? -> Bây giờ, tôi muốn đi Nhật."}, {"id": 7, "type": "sorting", "q_kanji": "どんな 味の食べ物が 好きですか。", "q_kana": "どんな あじのたべものが すきですか。", "a_kanji_chunks": ["甘い", "食べ物が", "好き", "です。"], "a_kana_chunks": ["あまい", "たべものが", "すき", "です。"], "vi": "Bạn thích đồ ăn vị gì? -> Tôi thích đồ ăn ngọt."}, {"id": 8, "type": "sorting", "q_kanji": "ピクニックのとき 何をもっていきますか。", "q_kana": "ピクニックのとき なにをもっていきますか。", "a_kanji_chunks": ["お弁当と", "お茶を", "もって", "いきます。"], "a_kana_chunks": ["おべんとうと", "おちゃを", "もって", "いきます。"], "vi": "Khi đi dã ngoại bạn mang theo gì? -> Tôi mang theo cơm hộp và trà."}, {"id": 9, "type": "sorting", "q_kanji": "ペン・けいたいでんわを 借りてもいいですか。", "q_kana": "ペン・けいたいでんわを かりてもいいですか。", "a_kanji_chunks": ["はい、", "どうぞ。"], "a_kana_chunks": ["はい、", "どうぞ。"], "vi": "Tôi có thể mượn bút / điện thoại được không? -> Vâng, xin mời."}, {"id": 10, "type": "sorting", "q_kanji": "日本料理を 食べたことが ありますか。", "q_kana": "にほんりょうりを たべたことが ありますか。", "a_kanji_chunks": ["はい、", "あります。", "すしを", "食べました。"], "a_kana_chunks": ["はい、", "あります。", "すしを", "たべました。"], "vi": "Bạn đã từng ăn món ăn Nhật chưa? -> Vâng, có. Tôi đã ăn sushi."}, {"id": 11, "type": "sorting", "q_kanji": "趣味は なんですか。週に何回 していますか。", "q_kana": "しゅみは なんですか。しゅうになんかい していますか。", "a_kanji_chunks": ["私の", "趣味は", "スポーツです。", "1週間に", "2回ぐらい", "しています。"], "a_kana_chunks": ["わたしの", "しゅみは", "スポーツです。", "いっしゅうかんに", "にかいぐらい", "しています。"], "vi": "Sở thích của bạn là gì? Mỗi tuần bạn làm mấy lần? -> Sở thích của tôi là thể thao. 1 tuần tôi tập khoảng 2 lần."}, {"id": 12, "type": "sorting", "q_kanji": "どんな国に きょうみが ありますか。", "q_kana": "どんなくにに きょうみが ありますか。", "a_kanji_chunks": ["日本に", "きょうみが", "あります。", "日本の", "食べ物に", "きょうみが", "あります。"], "a_kana_chunks": ["にほんに", "きょうみが", "あります。", "にほんの", "たべものに", "きょうみが", "あります。"], "vi": "Bạn hứng thú với đất nước nào? -> Tôi hứng thú với Nhật Bản. Tôi hứng thú với đồ ăn Nhật."}, {"id": 13, "type": "sorting", "q_kanji": "お茶と ジュースと どちらがいいですか。", "q_kana": "おちゃと ジュースと どちらがいいですか。", "a_kanji_chunks": ["お茶の", "ほうが", "いいです。"], "a_kana_chunks": ["おちゃの", "ほうが", "いいです。"], "vi": "Trà và nước hoa quả, cái nào tốt hơn? -> Trà tốt hơn."}, {"id": 14, "type": "sorting", "q_kanji": "寝る前に、何をしますか。", "q_kana": "ねるまえに、なにをしますか。", "a_kanji_chunks": ["寝る", "前に、", "本を", "読みます。"], "a_kana_chunks": ["ねる", "まえに、", "ほんを", "よみます。"], "vi": "Trước khi ngủ bạn làm gì? -> Trước khi ngủ tôi đọc sách."}, {"id": 15, "type": "sorting", "q_kanji": "ジョギングを する前に、何をしますか。", "q_kana": "ジョギングを するまえに、なにをしますか。", "a_kanji_chunks": ["ジョギングを", "するまえに、", "準備運動を", "します。"], "a_kana_chunks": ["ジョギングを", "するまえに、", "じゅんびうんどうを", "します。"], "vi": "Trước khi chạy bộ bạn làm gì? -> Trước khi chạy bộ tôi khởi động."}, {"id": 16, "type": "sorting", "q_kanji": "寝る前に、お風呂に入りますか。", "q_kana": "ねるまえに、おふろにはいりますか。", "a_kanji_chunks": ["寝る", "まえに、", "お風呂に", "入ります。"], "a_kana_chunks": ["ねる", "まえに、", "おふろに", "はいります。"], "vi": "Trước khi ngủ bạn có tắm bồn không? -> Trước khi ngủ tôi tắm bồn."}, {"id": 17, "type": "sorting", "q_kanji": "ごはんを 食べる前に、何をしますか。", "q_kana": "ごはんを たべるまえに、なにをしますか。", "a_kanji_chunks": ["ごはんを", "食べる", "まえに、", "手を", "洗います。"], "a_kana_chunks": ["ごはんを", "たべる", "まえに、", "てを", "あらいます。"], "vi": "Trước khi ăn cơm bạn làm gì? -> Trước khi ăn cơm tôi rửa tay."}, {"id": 18, "type": "sorting", "q_kanji": "泳ぐ前に、何をしますか。", "q_kana": "およぐまえに、なにをしますか。", "a_kanji_chunks": ["泳ぐ", "まえに、", "たいそうを", "します。"], "a_kana_chunks": ["およぐ", "まえに、", "たいそうを", "します。"], "vi": "Trước khi bơi bạn làm gì? -> Trước khi bơi tôi tập thể dục."}, {"id": 19, "type": "sorting", "q_kanji": "友だちは さいきん あまり寝られません。アドバイスをしてください。", "q_kana": "ともだちは さいきん あまりねられません。アドバイスをしてください。", "a_kanji_chunks": ["寝る", "前に、", "温かい", "牛乳を", "飲んだ", "ほうがいいです。"], "a_kana_chunks": ["ねる", "まえに、", "あたたかい", "ぎゅうにゅうを", "のんだ", "ほうがいいです。"], "vi": "Bạn tôi gần đây không ngủ được. Xin hãy cho lời khuyên. -> Trước khi ngủ nên uống sữa ấm."}, {"id": 20, "type": "sorting", "q_kanji": "けんこうのために 何か していますか。", "q_kana": "けんこうのために なにか していますか。", "a_kanji_chunks": ["けんこうの", "ために、", "野菜を", "食べたり、", "運動を", "したり", "しています。"], "a_kana_chunks": ["けんこうの", "ために、", "やさいを", "たべたり、", "うんどうを", "したり", "しています。"], "vi": "Bạn có đang làm gì vì sức khỏe không? -> Vì sức khỏe, tôi ăn rau, tập thể dục..."}];

    // Session Persistence
    function saveSession() {
        const sessionData = {
            levelIndex: currentLevelIndex,
            questionIndex: currentQuestionIndex,
            activeQuestions: activeQuestions,
            history: historyStack,
            isKanaMode: isKanaMode
        };
        localStorage.setItem('jap183_session', JSON.stringify(sessionData));

        isKanaMode = !isKanaMode;

    function speakJP(text) {
        const key = text.replace(/ /g, '');
        if (ttsMap[key]) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            currentAudio = new Audio(ttsMap[key]);
            currentAudio.play().catch(e=>console.log(e));
        }

    function playQuestionAudio() {
        const q = activeQuestions[currentQuestionIndex];
        speakJP(q.q_kana);
    }

    function renderLevels() {
        const container = document.getElementById('level-container');
        container.innerHTML = '';
        const numLevels = Math.ceil(questions.length / 5);
        
        let activeLevel = 0;
        while(completedLevels.includes(activeLevel) && activeLevel < numLevels) activeLevel++;
        if(activeLevel >= numLevels) activeLevel = numLevels - 1;

        for(let i=0; i<numLevels; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'lesson-node-wrapper';
            const offset = (i % 4 === 0) ? 0 : (i % 4 === 1 || i % 4 === 3) ? -35 : -55;
            wrapper.style.right = offset + 'px';

            const isCompleted = completedLevels.includes(i);
            const isActive = (i === activeLevel);
            const isLocked = !isCompleted && !isActive;

            const btn = document.createElement('button');
            btn.className = 'lesson-button ' + (isCompleted ? 'completed' : isActive ? 'active-node' : 'locked');
            
            if (isActive) {
                btn.innerHTML = '<svg class="lesson-icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>';

    function startLevel(index) {

        activeQuestions = JSON.parse(JSON.stringify(questions.slice(start, start + 5)));

        historyStack = [];
        saveSession();
        
        document.getElementById('start-overlay').style.display = 'none';
        document.getElementById('header').style.display = 'flex';
        ui.quizScreen.style.display = 'flex';
        ui.bottomBar.style.display = 'flex';
        loadQuestion();
    }

    function goBack() {
        if (historyStack.length > 0) {
            const prevState = historyStack.pop();
            currentQuestionIndex = prevState.qIndex;
            activeQuestions = prevState.activeQ;
            
            if (recognition && btnMic.style.background === 'var(--red)') {
                recognition.stop();
            }
            
            saveSession();
            loadQuestion();
        }
    }

    function loadQuestion() {
        if (currentQuestionIndex >= activeQuestions.length) {
            if(!completedLevels.includes(currentLevelIndex)) {
                completedLevels.push(currentLevelIndex);
                localStorage.setItem('jap183_completed', JSON.stringify(completedLevels));
            }
            clearSession();
            ui.quizScreen.style.display = 'none'; document.getElementById('header').style.display = 'none'; ui.bottomBar.style.display = 'none';
            document.getElementById('end-screen').style.display = 'flex'; return;
        }
        
        const q = activeQuestions[currentQuestionIndex];
        isChecked = false;
        ui.bottomBar.className = 'bottom-bar'; ui.feedbackContainer.style.display = 'none';
        ui.btnCheck.className = 'btn-check'; ui.btnCheck.innerText = 'KIỂM TRA';
        ui.progressBar.style.width = ((currentQuestionIndex / activeQuestions.length) * 100) + '%';
        
        if (q.type === 'sorting') {
            const targetArray = isKanaMode ? q.a_kana_chunks : q.a_kanji_chunks;
            let blocks = targetArray.map((text, i) => ({ text, id: i, kanji: q.a_kanji_chunks[i], kana: q.a_kana_chunks[i] }));
            wordBankState = blocks.sort(() => Math.random() - 0.5);
            currentAnswerBlocks = [];
        } else {
            ui.fcReveal.style.display = 'none';
            ui.fcReveal.innerHTML = `${q.q_kana}<br><br><span style="color:#777; font-size:16px;">${q.vi}</span>`;
        }
        renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
        const q = activeQuestions[currentQuestionIndex];
        ui.btnToggle.className = isKanaMode ? 'toggle-btn active' : 'toggle-btn';
        
        if (q.type === 'reading') {
            accumulatedSpeech = "";
            isRecording = false;
            if(btnMic) btnMic.classList.remove('mic-recording');
            ui.sortingMode.style.display = 'none'; ui.readingMode.style.display = 'block';
            document.getElementById('q-title').innerText = "Đọc to câu sau";
            ui.fcText.innerText = isKanaMode ? q.q_kana : q.q_kanji;
            ui.btnCheck.classList.remove('active');
            if(speechResult) speechResult.innerText = "Bấm Mic để nói. Xong thì bấm nút KIỂM TRA.";
        } else {
            ui.sortingMode.style.display = 'flex'; ui.sortingMode.style.flexDirection = 'column'; ui.readingMode.style.display = 'none';
            document.getElementById('q-title').innerText = "Nghe và sắp xếp câu trả lời";
            ui.qSpeech.innerText = isKanaMode ? q.q_kana : q.q_kanji;
            
            ui.dropZone.innerHTML = '';
            currentAnswerBlocks.forEach((b, i) => {
                const d = document.createElement('div'); d.className = 'word-chunk'; 
                d.innerText = isKanaMode ? b.kana : b.kanji;
                d.onclick = () => { if(!isChecked) { wordBankState.push(b); currentAnswerBlocks.splice(i, 1); renderCurrentQuestion(); } };
                ui.dropZone.appendChild(d);
            });

            ui.wordBank.innerHTML = '';
            wordBankState.forEach((b, i) => {
                const d = document.createElement('div'); d.className = 'word-chunk';
                d.innerText = isKanaMode ? b.kana : b.kanji;
                d.onclick = () => { if(!isChecked) { currentAnswerBlocks.push(b); wordBankState.splice(i, 1); speakJP(d.innerText); renderCurrentQuestion(); } };

            if (currentAnswerBlocks.length > 0 && wordBankState.length === 0) {
                ui.btnCheck.classList.add('active');

                ui.btnCheck.classList.remove('active');

                        ui.bottomBar.className = 'bottom-bar incorrect';
                        ui.feedbackTitle.innerText = 'Chưa chính xác!';
                        ui.feedbackExplanation.innerHTML = `Hệ thống nghe được:<br><span style="color:var(--red-dark); font-weight:bold;">${accumulatedSpeech}</span><br><br>Đáp án đúng:<br><b>${q.q_kana}</b>`;
                        audioWrong.currentTime = 0; audioWrong.play().catch(e=>e);
                    }
                }
            } else {
                const userIds = currentAnswerBlocks.map(b => b.id).join(',');
                const correctIds = q.a_kanji_chunks.map((_, i) => i).join(',');
                const isCorrect = userIds === correctIds;
                const fullKana = q.a_kana_chunks.join('');
                if (isCorrect) {
                    ui.bottomBar.className = 'bottom-bar correct';
                    ui.feedbackTitle.innerText = 'Chính xác!';
                    ui.feedbackExplanation.innerHTML = `<b>${fullKana}</b><br>${q.vi}`;
                    audioCorrect.currentTime = 0; audioCorrect.play().catch(e=>e);
                    speakJP(fullKana);
                } else {
                    ui.bottomBar.className = 'bottom-bar incorrect';
                    ui.feedbackTitle.innerText = 'Chưa đúng rồi!';
                    ui.feedbackExplanation.innerHTML = `Đáp án đúng:<br><b>${isKanaMode ? fullKana : q.a_kanji_chunks.join('')}</b><br>${q.vi}`;
                    audioWrong.currentTime = 0; audioWrong.play().catch(e=>e);
                }
            }
        } else {
            historyStack.push({
                qIndex: currentQuestionIndex,
                activeQ: JSON.parse(JSON.stringify(activeQuestions))
            });

            if (q.type === 'reading') {
                currentQuestionIndex++;
            } else {
                const userIds = currentAnswerBlocks.map(b => b.id).join(',');
                const correctIds = q.a_kanji_chunks.map((_, i) => i).join(',');
                if (userIds === correctIds) currentQuestionIndex++;
                else activeQuestions.push(activeQuestions.splice(currentQuestionIndex, 1)[0]);
            }
            saveSession();
            loadQuestion();
        }
    }

    function backToMap() {
        if(document.getElementById('quiz-screen').style.display !== 'none' && !confirm("Cậu có chắc chắn muốn thoát? Quá trình của ải này sẽ bị hủy bỏ.")) return;
        clearSession();
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('header').style.display = 'none';
        document.getElementById('bottom-bar').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('start-overlay').style.display = 'flex';
        renderLevels();
    }

    // ==== SPEECH RECOGNITION ====
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;
    let accumulatedSpeech = "";

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;
    }

    const btnMic = document.getElementById('btn-mic');
    const speechResult = document.getElementById('speech-result');

    if (btnMic) {
        btnMic.onclick = () => {
            if (!recognition) {
                alert("Trình duyệt của bạn không hỗ trợ thu âm (Hãy dùng Chrome/Edge)!");
                return;
            }
            if (isRecording) {
                isRecording = false;
                recognition.stop();
                return;
            }
            accumulatedSpeech = '';
            isRecording = true;
            btnMic.classList.add('mic-recording');
            speechResult.innerText = "Đang nghe...";
            ui.btnCheck.classList.remove('active');
            recognition.start();
        };
    }

    if (recognition) {
        recognition.onresult = (event) => {
            let interimTranscript = '';
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            
            accumulatedSpeech += finalTranscript;
            const fullTranscript = accumulatedSpeech + interimTranscript;
            speechResult.innerHTML = `Nghe được: <span style="color:var(--blue); font-weight:900;">${fullTranscript}</span>`;
            
            if (fullTranscript.trim().length > 0) {
                ui.btnCheck.classList.add('active'); // Allow manual check
            }
        };
        recognition.onerror = (event) => {
            resetMicBtn();
            if(!accumulatedSpeech) speechResult.innerText = "Lỗi mic: " + event.error;
        };
        recognition.onend = () => {
            if (isRecording) {
                // Trình duyệt tự tắt do im lặng quá lâu -> Tự động bật lại!
                try {
                    recognition.start();
                    return; // Đừng đổi UI
                } catch(e) {
                    resetMicBtn();
                }
            } else {
                resetMicBtn();
            }
            
            if (!accumulatedSpeech && !speechResult.innerText.includes('Lỗi')) {
                speechResult.innerText = "Đã ngắt thu âm. Nhấn KIỂM TRA để nộp hoặc nhấn Mic nói lại.";
            }
        }
    }

    function resetMicBtn() {
        isRecording = false;
        if(btnMic) btnMic.classList.remove('mic-recording');
    }

    function skipSpeaking() {
        isRecording = false;
        if(recognition) recognition.stop();
        accumulatedSpeech = "SKIP_SPEAKING";
        ui.btnCheck.classList.add('active');
        onCheckClick();
    }
    
    // Check existing session on load
    window.onload = () => {
        renderLevels();
        const saved = localStorage.getItem('jap183_session');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                currentLevelIndex = data.levelIndex;
                currentQuestionIndex = data.questionIndex;
                activeQuestions = data.activeQuestions;
                historyStack = data.history || [];
                isKanaMode = data.isKanaMode || false;
                
                document.getElementById('start-overlay').style.display = 'none';
                document.getElementById('header').style.display = 'flex';
                ui.quizScreen.style.display = 'flex';
                ui.bottomBar.style.display = 'flex';
                loadQuestion();
            } catch(e) {}
        }
    };
</script>
