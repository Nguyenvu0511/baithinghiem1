<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duolingo Clone - JAP 13-14</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-500: #22c55e;
            --green-600: #16a34a;
            --green-400: #4ade80;
            --neutral-200: #e5e7eb;
            --neutral-400: #a3a3a3;
            --gray: #e5e5e5;
            --gray-dark: #afafaf;
            --text-main: #3c3c3c;
            --blue: #1cb0f6;
            --blue-dark: #1899d6;
            --red: #ff4b4b;
            --red-dark: #ea2b2b;
            --gold: #ffc800;
            --bg: #ffffff;
        }
        
        * { box-sizing: border-box; user-select: none; font-family: 'Nunito', sans-serif; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            display: flex; flex-direction: column; height: 100vh;
        }
        
        /* HEADER */
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px; max-width: 800px; margin: 0 auto; width: 100%;
        }
        .close-btn {
            cursor: pointer; font-size: 28px; color: var(--gray-dark); font-weight: 900;
            width: 40px; text-align: center; transition: 0.2s;
        }
        .close-btn:hover { color: #777; }
        .progress-bar-bg {
            flex-grow: 1; background: var(--gray); height: 16px; border-radius: 8px;
            margin: 0 15px; position: relative; overflow: hidden;
        }
        .progress-bar-fill {
            background: var(--green-500); height: 100%; width: 0%;
            border-radius: 8px; transition: width 0.3s ease-out; position: relative;
        }
        .progress-highlight {
            position: absolute; top: 4px; left: 10px; right: 10px; height: 4px;
            background: rgba(255,255,255,0.3); border-radius: 4px;
        }

        /* MAIN CONTENT */
        main {
            flex-grow: 1; display: flex; flex-direction: column; 
            max-width: 600px; margin: 0 auto; width: 100%; padding: 0 20px;
            overflow-y: auto; padding-bottom: 120px;
        }
        
        h1.title { font-size: 28px; font-weight: 800; margin-bottom: 20px; color: var(--text-main); }
        
        .question-card { display: flex; align-items: center; margin-bottom: 30px; gap: 15px; }
        .mascot {
            width: 100px; height: 120px; flex-shrink: 0;
            background: url('https://d35aaqx5ub95lt.cloudfront.net/images/owls/74bc0560a0ce733a1cc59cfaaa823053.svg') no-repeat center;
            background-size: contain;
        }
        .speech-bubble {
            border: 2px solid var(--gray); border-radius: 15px; padding: 15px 20px;
            position: relative; font-size: 22px; font-weight: 700; color: var(--text-main);
            flex-grow: 1; min-height: 80px; display: flex; align-items: center;
        }
        .speech-bubble::before {
            content: ''; position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
            border-width: 10px 12px 10px 0; border-style: solid;
            border-color: transparent var(--gray) transparent transparent;
        }
        .speech-bubble::after {
            content: ''; position: absolute; left: -7px; top: 50%; transform: translateY(-50%);
            border-width: 8px 10px 8px 0; border-style: solid;
            border-color: transparent #fff transparent transparent;
        }
        
        .listen-btn {
            background: var(--blue); color: white; border: none; border-radius: 15px;
            width: 80px; height: 80px; font-size: 40px; cursor: pointer;
            box-shadow: 0 5px 0 var(--blue-dark); transition: 0.1s; display: flex;
            align-items: center; justify-content: center; margin: 0 auto;
        }
        .listen-btn:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }

        /* OPTIONS */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 15px; width: 100%; }
        @media (min-width: 500px) { .options-grid { grid-template-columns: 1fr 1fr; } }
        
        .option {
            border: 2px solid var(--gray); border-radius: 15px; padding: 15px;
            font-size: 18px; font-weight: 700; cursor: pointer; text-align: center;
            border-bottom: 4px solid var(--gray); transition: 0.1s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 70px;
        }
        .option:active:not(.disabled) { border-bottom-width: 0px; transform: translateY(4px); }
        .option.selected { border-color: var(--blue); background: #ddf4ff; color: var(--blue); }
        .option.disabled { opacity: 0.5; cursor: default; pointer-events: none; border-bottom-width:0; transform: translateY(4px); }
        
        /* BOTTOM BAR */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; 
            padding: 20px; border-top: 2px solid var(--gray); background: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999;
        }
        .bottom-bar.correct { background: #d7ffb8; border-color: #d7ffb8; }
        .bottom-bar.incorrect { background: #ffdfe0; border-color: #ffdfe0; }
        
        .bottom-content { max-width: 800px; width: 100%; display: flex; align-items: center; justify-content: space-between; }
        .feedback { display: none; flex-grow: 1; padding-right: 15px; }
        .feedback h2 { margin: 0 0 5px 0; font-size: 24px; font-weight: 900; }
        .bottom-bar.correct .feedback h2 { color: var(--green-600); }
        .bottom-bar.incorrect .feedback h2 { color: var(--red-dark); }
        
        .feedback .explanation { font-size: 16px; font-weight: 700; color: #777; }
        
        .btn-check {
            background: var(--neutral-200); color: var(--neutral-400);
            border: none; border-radius: 15px; padding: 15px 30px; font-size: 18px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px; cursor: default;
            transition: 0.1s; min-width: 150px; border-bottom: 4px solid var(--neutral-200);
        }
        .btn-check.active {
            background: var(--green-500); color: white; cursor: pointer; border-bottom-color: var(--green-600);
        }
        .btn-check.active:active { border-bottom-width:0; transform: translateY(4px); }
        
        .bottom-bar.incorrect .btn-check.active { background: var(--red); border-bottom-color: var(--red-dark); }
        
        /* EXACT CLONE START SCREEN */
        #start-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; background: #fff; z-index:9999;
            display:flex; flex-direction:column; align-items:center; overflow-y: auto; overflow-x: hidden; padding: 20px;
        }
        .unit-banner {
            background-color: var(--green-500); color: white; padding: 20px; border-radius: 15px;
            margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 550px;
        }
        .unit-banner h2 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 0.5px; }
        .unit-banner p { margin: 5px 0 0 0; font-size: 17px; font-weight: 700; opacity: 0.9; }
        
        .path-container {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 550px; padding-bottom: 50px; padding-top: 10px;
        }

        .lesson-node-wrapper {
            position: relative; height: 102px; width: 102px; margin-top: 24px;
            display: flex; align-items: center; justify-content: center;
        }

        .lesson-button {
            width: 70px; height: 70px; border-radius: 50%;
            border: none; border-bottom: 8px solid;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: absolute; z-index: 2; transition: 0.1s;
        }
        
        .lesson-button.active-node, .lesson-button.completed {
            background-color: var(--green-500); border-bottom-color: var(--green-600);
        }
        .lesson-button.active-node:active, .lesson-button.completed:active {
            border-bottom-width: 0px; transform: translateY(8px);
        }
        
        .lesson-button.locked {
            background-color: var(--neutral-200); border-bottom-color: var(--neutral-400); cursor: not-allowed;
        }

        .lesson-icon { width: 36px; height: 36px; }
        
        .lesson-button.active-node .lesson-icon, .lesson-button.completed .lesson-icon {
            fill: white; stroke: white; color: white; stroke-width: 2;
        }
        .lesson-button.completed .lesson-icon {
            fill: none; stroke: white; stroke-width: 4;
        }
        .lesson-button.locked .lesson-icon {
            fill: var(--neutral-400); stroke: var(--neutral-400); color: var(--neutral-400); stroke-width: 2;
        }

        .progress-ring {
            position: absolute; top: 0; left: 0; width: 102px; height: 102px; transform: rotate(-90deg); z-index: 1; pointer-events: none;
        }

        .start-tooltip {
            position: absolute; top: -28px; left: 5px; z-index: 10;
            background-color: white; border: 2px solid var(--neutral-200); border-radius: 12px;
            padding: 8px 12px; font-weight: 900; font-size: 15px; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--green-500); animation: bounce 2s infinite; pointer-events: none;
        }
        .start-tooltip::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 8px solid var(--neutral-200);
        }
        .start-tooltip::before {
            content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
            border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid white; z-index: 2;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        
    </style>
</head>
<body>

<div id="start-overlay">
    <div class="unit-banner">
        <div>
            <h2>Unit Mới</h2>
            <p>Đang chờ dữ liệu...</p>
        </div>
    </div>
    <div class="path-container" id="level-container">
        <!-- Nodes injected here -->
    </div>
</div>

<header id="header" style="display:none;">
    <div class="close-btn" onclick="backToMap()" title="Thoát">✖</div>
    <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"><div class="progress-highlight"></div></div>
    </div>
    <div style="width: 40px;"></div>
</header>

<main id="quiz-screen" style="display:none;">
    <h1 class="title" id="q-title">Viết lại bằng tiếng Việt</h1>
    
    <div class="question-card" id="q-card">
        <div class="mascot"></div>
        <div class="speech-bubble" id="q-content" onclick="replayQuestionAudio()" style="cursor:pointer;">からい</div>
    </div>
    
    <div id="listen-card" style="display:none; text-align:center; margin-bottom:40px;">
        <button class="listen-btn" onclick="replayQuestionAudio()">🔊</button>
        <button onclick="disableListening()" style="margin-top:20px; background:none; border:none; color:var(--neutral-400); font-weight:700; font-size:16px; cursor:pointer; text-decoration:underline;">Không thể nghe lúc này</button>
    </div>

    <div class="options-grid" id="options-container">
        <!-- Options injected here -->
    </div>
</main>

<main id="end-screen" style="display: none; align-items: center; justify-content: center; text-align: center; flex-direction:column; height: 100vh;">
    <div class="duo-logo" style="margin:0 auto; width: 150px; height: 150px; background: url('https://d35aaqx5ub95lt.cloudfront.net/images/owls/74bc0560a0ce733a1cc59cfaaa823053.svg') no-repeat center; background-size: contain;"></div>
    <h1 style="color:var(--gold); font-weight:900; font-size:36px; margin-bottom:10px;">Hoàn thành!</h1>
    <p style="font-size: 18px; font-weight:700; color:var(--gray-dark);">Cậu đã vượt qua ải này xuất sắc!</p>
    <button class="btn-check active" style="margin-top:40px; width:200px;" onclick="backToMap()">VỀ TRANG CHỦ</button>
</main>

<div class="bottom-bar" id="bottom-bar" style="display:none;">
    <div class="bottom-content">
        <div class="feedback" id="feedback-container">
            <h2 id="feedback-title">Chính xác!</h2>
            <div class="explanation" id="feedback-explanation">Mẹo: Nhớ kỹ nhé!</div>
        </div>
        <button class="btn-check" id="btn-check" onclick="onCheckClick()">KIỂM TRA</button>
    </div>
</div>

<script>
    let questions = [{"type": "vocab", "title": "Dữ liệu đang trống", "subtitle": "Bài học mới", "content": "Hãy tải lên bài học mới", "options": ["OK"], "correct": 0, "vi_hint": "Bắt đầu bài mới"}];
    const ttsMap = {};

    let activeQuestions = [];
    let currentLevelIndex = 0;
    let currentQuestionIndex = 0;
    
    let selectedOption = null;
    let isChecked = false;
    let displayMode = 'normal';
    let canListen = true;
    
    let completedLevels = JSON.parse(localStorage.getItem('jap_completed_levels_v2') || '[]');
    
    const ui = {
        title: document.getElementById('q-title'),
        content: document.getElementById('q-content'),
        qCard: document.getElementById('q-card'),
        listenCard: document.getElementById('listen-card'),
        optionsContainer: document.getElementById('options-container'),
        btnCheck: document.getElementById('btn-check'),
        bottomBar: document.getElementById('bottom-bar'),
        feedbackContainer: document.getElementById('feedback-container'),
        feedbackTitle: document.getElementById('feedback-title'),
        feedbackExplanation: document.getElementById('feedback-explanation'),
        progressBar: document.getElementById('progress-bar'),
        quizScreen: document.getElementById('quiz-screen'),
        endScreen: document.getElementById('end-screen'),
        header: document.getElementById('header')
    };

    const audioCorrect = new Audio('duolingo-correct.mp3');
    const audioWrong = new Audio('duolingo-wrong.mp3');

    const SVGS = {
        check: '<svg class="lesson-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>',
        star: '<svg class="lesson-icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>',
        crown: '<svg class="lesson-icon" viewBox="0 0 24 24"><polygon points="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"></polygon></svg>'
    };

    // EXACT DUOLINGO OFFSET LOGIC
    function getRightPosition(index) {
        const cycleLength = 8;
        const cycleIndex = index % cycleLength;
        let indentationLevel;
        if (cycleIndex <= 2) indentationLevel = cycleIndex;
        else if (cycleIndex <= 4) indentationLevel = 4 - cycleIndex;
        else if (cycleIndex <= 6) indentationLevel = 4 - cycleIndex;
        else indentationLevel = cycleIndex - 8;
        return indentationLevel * 40;
    }

    function renderLevels() {
        const container = document.getElementById('level-container');
        container.innerHTML = '';
        const numLevels = Math.ceil(questions.length / 10);
        
        let activeLevel = 0;
        while(completedLevels.includes(activeLevel) && activeLevel < numLevels) {
            activeLevel++;
        }
        if(activeLevel >= numLevels) activeLevel = numLevels - 1;

        for(let i=0; i<numLevels; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'lesson-node-wrapper';
            if (i===0) wrapper.classList.add('is-first');
            
            wrapper.style.right = getRightPosition(i) + 'px';

            const isCompleted = completedLevels.includes(i);
            const isActive = (i === activeLevel);
            const isLocked = !isCompleted && !isActive;

            const btn = document.createElement('button');
            btn.className = 'lesson-button ' + (isCompleted ? 'completed' : isActive ? 'active-node' : 'locked');
            
            if (isActive) {
                btn.innerHTML = SVGS.star;
                
                // Real SVG Circular Progress Bar
                const ring = document.createElement('div');
                ring.innerHTML = `
                <svg width="102" height="102" viewBox="0 0 102 102" class="progress-ring">
                   <circle cx="51" cy="51" r="46" stroke="var(--neutral-200)" stroke-width="8" fill="none" />
                   <circle cx="51" cy="51" r="46" stroke="var(--green-400)" stroke-width="8" fill="none" stroke-dasharray="289" stroke-dashoffset="231" stroke-linecap="round" />
                </svg>`;
                wrapper.appendChild(ring.firstElementChild);
                
                const tooltip = document.createElement('div');
                tooltip.className = 'start-tooltip';
                tooltip.innerText = 'START';
                wrapper.appendChild(tooltip);
            } else if (isCompleted) {
                btn.innerHTML = SVGS.check;
            } else {
                btn.innerHTML = (i === numLevels - 1) ? SVGS.crown : SVGS.star;
            }
            
            if(!isLocked) {
                btn.onclick = () => startLevel(i);
            }
            
            wrapper.appendChild(btn);
            container.appendChild(wrapper);
        }
    }
    renderLevels();

    function backToMap() {
        if(document.getElementById('quiz-screen').style.display !== 'none' && !confirm("Cậu có chắc chắn muốn thoát? Quá trình của ải này sẽ bị hủy bỏ.")) {
            return;
        }
        ui.quizScreen.style.display = 'none';
        ui.header.style.display = 'none';
        ui.bottomBar.style.display = 'none';
        ui.endScreen.style.display = 'none';
        document.getElementById('start-overlay').style.display = 'flex';
        renderLevels();
    }

    function startLevel(index) {
        currentLevelIndex = index;
        const start = index * 10;
        const end = start + 10;
        activeQuestions = JSON.parse(JSON.stringify(questions.slice(start, end)));
        
        document.getElementById('start-overlay').style.display = 'none';
        ui.header.style.display = 'flex';
        ui.quizScreen.style.display = 'flex';
        ui.bottomBar.style.display = 'flex';
        ui.endScreen.style.display = 'none';
        
        currentQuestionIndex = 0;
        loadQuestion();
    }

    function disableListening() {
        canListen = false;
        displayMode = 'normal';
        renderCurrentMode();
    }

    function speakJP(text) {
        if (ttsMap[text]) {
            const a = new Audio(ttsMap[text]);
            a.play().catch(e=>console.log(e));
        }
    }

    function replayQuestionAudio() {
        speakJP(activeQuestions[currentQuestionIndex].content);
    }

    function loadQuestion() {
        if (currentQuestionIndex >= activeQuestions.length) {
            if(!completedLevels.includes(currentLevelIndex)) {
                completedLevels.push(currentLevelIndex);
                localStorage.setItem('jap_completed_levels_v2', JSON.stringify(completedLevels));
            }
            ui.quizScreen.style.display = 'none';
            ui.header.style.display = 'none';
            ui.bottomBar.style.display = 'none';
            ui.endScreen.style.display = 'flex';
            return;
        }

        const q = activeQuestions[currentQuestionIndex];
        
        displayMode = 'normal';
        if (canListen && q.type === 'vocab' && ttsMap[q.content] && Math.random() < 0.3) {
            displayMode = 'listen';
        }
        
        renderCurrentMode();
    }

    function renderCurrentMode() {
        const q = activeQuestions[currentQuestionIndex];
        
        if (displayMode === 'listen') {
            ui.title.innerText = "Lắng nghe và chọn đáp án";
            ui.qCard.style.display = 'none';
            ui.listenCard.style.display = 'block';
        } else {
            ui.title.innerText = q.title;
            ui.qCard.style.display = 'flex';
            ui.listenCard.style.display = 'none';
            ui.content.innerText = q.content;
        }
        
        setTimeout(() => speakJP(q.content), 300);

        ui.optionsContainer.innerHTML = '';
        selectedOption = null;
        isChecked = false;
        
        q.options.forEach((opt, index) => {
            const div = document.createElement('div');
            div.className = 'option';
            div.innerText = opt;
            div.onclick = () => {
                if (isChecked) return;
                document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                div.classList.add('selected');
                selectedOption = index;
                ui.btnCheck.classList.add('active');
                speakJP(opt);
            };
            ui.optionsContainer.appendChild(div);
        });

        ui.bottomBar.className = 'bottom-bar';
        ui.feedbackContainer.style.display = 'none';
        ui.btnCheck.className = 'btn-check';
        ui.btnCheck.innerText = 'KIỂM TRA';
        
        const progress = (currentQuestionIndex / activeQuestions.length) * 100;
        ui.progressBar.style.width = progress + '%';
    }

    function onCheckClick() {
        if (selectedOption === null) return;
        const q = activeQuestions[currentQuestionIndex];

        if (!isChecked) {
            isChecked = true;
            const isCorrect = selectedOption === q.correct;
            
            ui.btnCheck.innerText = 'TIẾP TỤC';
            ui.feedbackContainer.style.display = 'block';
            
            let explainHtml = `<span style="font-size:22px; font-weight:900; color:var(--text-main);">${q.content}</span>`;
            if (q.explanation) {
                explainHtml += `<br><span style="margin-top:5px; display:inline-block;">${q.explanation}</span>`;
            }
            ui.feedbackExplanation.innerHTML = explainHtml;

            document.querySelectorAll('.option').forEach(opt => opt.classList.add('disabled'));

            if (isCorrect) {
                ui.bottomBar.className = 'bottom-bar correct';
                ui.feedbackTitle.innerText = 'Chính xác! Làm tốt lắm!';
                audioCorrect.currentTime = 0;
                audioCorrect.play().catch(e=>e);
            } else {
                ui.bottomBar.className = 'bottom-bar incorrect';
                ui.feedbackTitle.innerText = 'Chưa đúng rồi!';
                audioWrong.currentTime = 0;
                audioWrong.play().catch(e=>e);
                
                const correctOpt = document.querySelectorAll('.option')[q.correct];
                correctOpt.style.borderColor = 'var(--red)';
                correctOpt.style.color = 'var(--red)';
            }
        } else {
            if (selectedOption === q.correct) {
                currentQuestionIndex++;
            } else {
                activeQuestions.push(activeQuestions.splice(currentQuestionIndex, 1)[0]);
            }
            loadQuestion();
        }
    }
</script>
</body>
</html>
